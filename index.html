<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#070c1b">
  <meta name="description" content="Treino Superior / Inferior v4 — Baixo Volume / Alta Intensidade">
  <title>Gym App</title>

  <!-- PWA / iOS Add to Home Screen -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Gym App">
  <style>
    :root {
      color-scheme: dark;
      --bg: #070c1b;
      --panel: #0f1728;
      --panel-soft: #1a2435;
      --line: #263757;
      --line-bright: #46c3ff;
      --text: #f7fbff;
      --muted: #9eb7d7;
      --dim: #6d83a7;
      --blue: #46c3ff;
      --green: #41d99a;
      --violet: #8592ff;
      --rose: #ff6b96;
      --shadow: 0 18px 60px rgba(0, 0, 0, .2);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: var(--bg);
    }

    body {
      min-height: 100%;
      margin: 0;
      padding: 18px 0 88px;
      background:
        radial-gradient(circle at 16% 0%, rgba(70, 195, 255, .08), transparent 28rem),
        linear-gradient(180deg, #050917 0%, #071022 100%);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 0;
    }

    button,
    input {
      font: inherit;
    }

    button {
      -webkit-tap-highlight-color: transparent;
    }

    .app {
      width: min(100% - 28px, 736px);
      margin: 0 auto;
    }

    header {
      display: grid;
      gap: 4px;
      margin-bottom: 28px;
    }

    h1 {
      margin: 0;
      color: #63ceff;
      font-size: 24px;
      line-height: 1.08;
      font-weight: 780;
    }

    .subtitle {
      margin: 0;
      color: #bfd1ea;
      font-size: 13px;
      line-height: 1.5;
    }

    .top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .icon-button {
      display: grid;
      width: 38px;
      height: 38px;
      min-width: 38px;
      place-items: center;
      border: 1px solid rgba(116, 147, 190, .42);
      border-radius: 8px;
      background: rgba(9, 15, 32, .76);
      color: #9bdcff;
      cursor: pointer;
    }

    .icon-button:active {
      transform: translateY(1px);
    }

    .tabs-shell {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      width: 100%;
      margin-bottom: 20px;
      padding: 4px;
      border: 1px solid #283a5d;
      border-radius: 14px;
      background: rgba(8, 14, 30, .86);
      box-shadow: inset 0 0 0 1px rgba(82, 116, 164, .15);
      gap: 4px;
      overflow: visible;
      scrollbar-width: none;
    }

    .tabs-shell::-webkit-scrollbar {
      display: none;
    }

    .tab {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      min-height: 32px;
      min-width: 0;
      padding: 0 18px;
      border: 1px solid transparent;
      border-radius: 10px;
      background: transparent;
      color: #93a7c8;
      font-size: 13px;
      font-weight: 650;
      cursor: pointer;
    }

    .tab-label {
      min-width: 0;
      overflow-wrap: anywhere;
    }

    .tab-dot {
      width: 9px;
      height: 9px;
      flex: 0 0 auto;
      border-radius: 50%;
      background: var(--tab-color);
      box-shadow: 0 0 16px var(--tab-color);
    }

    .tab[aria-selected="true"] {
      border-color: var(--blue);
      color: #ffffff;
      background: rgba(70, 195, 255, .08);
      box-shadow: 0 0 0 1px rgba(70, 195, 255, .15), inset 0 0 18px rgba(70, 195, 255, .08);
    }

    .workout {
      display: grid;
      gap: 12px;
    }

    .day-summary {
      display: grid;
      gap: 4px;
      padding: 2px 0 4px;
    }

    .day-summary h2 {
      margin: 0;
      color: #ffffff;
      font-size: 18px;
      line-height: 1.25;
      font-weight: 780;
    }

    .day-summary p {
      margin: 0;
      color: #9fc4e8;
      font-size: 12px;
      line-height: 1.45;
    }

    .day-kicker {
      color: #63ceff;
      font-size: 10px;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    .exercise {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(180px, 220px) auto;
      gap: 18px;
      min-height: 232px;
      padding: 20px 16px 16px;
      border: 1px solid rgba(62, 85, 126, .78);
      border-radius: 12px;
      background: linear-gradient(90deg, var(--panel-soft) 0%, #0c1324 36%, #080d1e 100%);
      box-shadow: var(--shadow);
      transition: border-color .18s ease, background .18s ease, transform .18s ease;
    }

    .exercise.done {
      border-color: rgba(65, 217, 154, .56);
      background:
        linear-gradient(90deg, rgba(25, 46, 49, .92) 0%, rgba(12, 26, 35, .96) 38%, #080d1e 100%);
    }

    .exercise-main {
      min-width: 0;
    }

    .exercise-title {
      margin: 0 0 3px;
      color: #ffffff;
      font-size: 16px;
      line-height: 1.28;
      font-weight: 780;
    }

    .exercise-note {
      margin: 0 0 16px;
      color: #9fc4e8;
      font-size: 12px;
      line-height: 1.45;
    }

    .exercise-visual {
      align-self: start;
      width: 220px;
      min-width: 180px;
      aspect-ratio: 1;
      margin: 0;
      overflow: hidden;
      border: 1px solid rgba(180, 191, 207, .55);
      border-radius: 12px;
      background: #f4f5f6;
      box-shadow: 0 14px 30px rgba(0, 0, 0, .22);
    }

    .movement-image {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #f4f5f6;
    }

    .exercise-visual.media-error {
      display: grid;
      place-items: center;
      padding: 14px;
      background: rgba(10, 17, 35, .9);
      color: #9fc4e8;
      font-size: 12px;
      line-height: 1.35;
      text-align: center;
    }

    .exercise-visual.media-error::before {
      content: "Imagem indisponível";
    }

    .metrics {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px 20px;
      margin-bottom: 18px;
    }

    .metric-label,
    label.weight-label {
      display: block;
      color: #7890b6;
      font-size: 9px;
      line-height: 1;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    .metric-value {
      margin-top: 7px;
      color: #ffffff;
      font-size: 14px;
      line-height: 1;
      font-weight: 760;
    }

    .weight-row {
      display: grid;
      grid-template-columns: 74px minmax(96px, 1fr);
      align-items: center;
      gap: 10px;
      max-width: 210px;
    }

    .weight-input {
      width: 96px;
      height: 31px;
      padding: 0 10px;
      border: 1px solid #53627c;
      border-radius: 6px;
      background: #070b19;
      color: #ffffff;
      outline: none;
      font-size: 14px;
      font-weight: 680;
    }

    .weight-input:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(70, 195, 255, .16);
    }

    .done-button {
      display: grid;
      width: 31px;
      height: 31px;
      min-width: 31px;
      place-items: center;
      margin-top: 1px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: #87caff;
      cursor: pointer;
    }

    .check-ring {
      display: grid;
      width: 19px;
      height: 19px;
      place-items: center;
      border: 2px solid currentColor;
      border-radius: 50%;
      color: #86bfff;
      font-size: 12px;
      line-height: 1;
      font-weight: 900;
    }

    .done .check-ring {
      color: var(--green);
    }

    .done .check-ring::before {
      content: "";
      width: 7px;
      height: 4px;
      margin-top: -2px;
      border-left: 2px solid currentColor;
      border-bottom: 2px solid currentColor;
      transform: rotate(-45deg);
    }

    .progress-line {
      display: flex;
      align-items: center;
      gap: 9px;
      margin-top: 10px;
      color: #8299bc;
      font-size: 11px;
      font-weight: 680;
    }

    .progress-track {
      position: relative;
      flex: 1;
      height: 4px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(75, 96, 134, .34);
    }

    .progress-fill {
      position: absolute;
      inset: 0 auto 0 0;
      width: var(--progress);
      border-radius: inherit;
      background: linear-gradient(90deg, #41d99a, #46c3ff);
    }

    .rest-bar {
      position: fixed;
      right: 0;
      bottom: 0;
      left: 0;
      z-index: 5;
      min-height: calc(62px + var(--safe-bottom));
      padding: 12px max(18px, env(safe-area-inset-right, 0px)) calc(12px + var(--safe-bottom)) max(18px, env(safe-area-inset-left, 0px));
      border-top: 1px solid #263653;
      background: rgba(13, 22, 39, .97);
      backdrop-filter: blur(18px);
      box-shadow: 0 -18px 42px rgba(0, 0, 0, .28);
    }

    .rest-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      width: min(100%, 736px);
      margin: 0 auto;
    }

    .rest-label {
      color: #8da5c8;
      font-size: 10px;
      line-height: 1;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    .timer {
      margin-top: 6px;
      color: #5dcfff;
      font-variant-numeric: tabular-nums;
      font-size: 18px;
      line-height: 1;
      font-weight: 780;
    }

    .timer.running {
      color: #ffffff;
    }

    .rest-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      min-width: 0;
    }

    .rest-button {
      display: inline-grid;
      min-width: 54px;
      height: 34px;
      place-items: center;
      padding: 0 14px;
      border: 1px solid #0ea5e9;
      border-radius: 999px;
      background: rgba(14, 165, 233, .06);
      color: #9ee3ff;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    .rest-button:active,
    .rest-button.active {
      background: rgba(14, 165, 233, .18);
      color: #ffffff;
      transform: translateY(1px);
    }

    .hidden {
      display: none;
    }

    @media (max-width: 560px) {
      body {
        padding-top: 16px;
      }

      .app {
        width: min(100% - 24px, 736px);
      }

      header {
        margin-bottom: 22px;
      }

      h1 {
        font-size: 23px;
      }

      .subtitle {
        max-width: 310px;
      }

      .tabs-shell {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .tab {
        width: 100%;
        min-width: 0;
        min-height: 42px;
        padding: 6px 10px;
        border-radius: 10px;
        font-size: 12px;
        line-height: 1.2;
        text-align: center;
        white-space: normal;
      }

      .tab:last-child:nth-child(odd) {
        grid-column: 1 / -1;
      }

      .exercise {
        grid-template-columns: minmax(0, 1fr) auto;
        min-height: 166px;
        padding: 18px 14px 15px;
        border-radius: 11px;
      }

      .exercise-visual {
        grid-column: 1 / -1;
        width: 100%;
        min-width: 0;
        height: auto;
        max-height: 260px;
        order: 2;
      }

      .done-button {
        grid-column: 2;
        grid-row: 1;
      }

      .metrics {
        grid-template-columns: repeat(2, minmax(96px, 1fr));
        gap: 12px;
      }

      .weight-row {
        grid-template-columns: 74px 96px;
      }

      .rest-inner {
        gap: 12px;
      }

      .rest-actions {
        min-width: 0;
        gap: 7px;
      }

      .rest-button {
        min-width: 44px;
        height: 34px;
        padding: 0 8px;
        font-size: 12px;
      }
    }
    /* === Login: profile picker + PIN === */
    #screen-picker[hidden],
    #screen-pin[hidden],
    .app-shell[hidden] {
      display: none;
    }

    .lock-screen {
      min-height: 100vh;
      padding: 56px 20px 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }

    .lock-header {
      text-align: center;
    }

    .lock-title {
      font-size: 28px;
      margin: 0;
      font-weight: 700;
      color: var(--blue);
      letter-spacing: -.02em;
    }

    .lock-subtitle {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .profile-list {
      width: 100%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .profile-card {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 16px 18px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 18px;
      color: var(--text);
      cursor: pointer;
      text-align: left;
      transition: transform .15s ease, border-color .15s ease, background .15s ease;
    }

    .profile-card:active {
      transform: translateY(1px);
      background: var(--panel-soft);
    }

    .profile-card:hover {
      border-color: var(--profile-color, var(--blue));
    }

    .profile-avatar {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 22px;
      background: color-mix(in srgb, var(--profile-color, var(--blue)) 14%, transparent);
      color: var(--profile-color, var(--blue));
      border: 2px solid var(--profile-color, var(--blue));
      flex-shrink: 0;
    }

    .profile-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .profile-name {
      font-size: 17px;
      font-weight: 600;
    }

    .profile-meta {
      font-size: 12px;
      color: var(--muted);
    }

    .pin-dots {
      display: flex;
      gap: 16px;
      justify-content: center;
    }

    .pin-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 2px solid var(--line);
      background: transparent;
      transition: background-color .12s ease, border-color .12s ease, transform .12s ease;
    }

    .pin-dot.filled {
      background: var(--blue);
      border-color: var(--blue);
      transform: scale(1.1);
    }

    .pin-error {
      min-height: 18px;
      color: var(--rose);
      font-size: 13px;
      text-align: center;
      margin: 0;
    }

    .pin-keypad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      width: 100%;
      max-width: 280px;
    }

    .pin-key {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 50%;
      width: 72px;
      height: 72px;
      margin: 0 auto;
      font-size: 24px;
      font-weight: 600;
      color: var(--text);
      cursor: pointer;
      transition: background-color .1s ease, border-color .1s ease, transform .1s ease;
    }

    .pin-key:active {
      background: var(--panel-soft);
      transform: scale(.95);
    }

    .pin-key.empty {
      visibility: hidden;
      pointer-events: none;
    }

    .pin-key.action {
      font-size: 20px;
      color: var(--muted);
    }

    .pin-back-btn {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 14px;
      cursor: pointer;
      padding: 12px;
    }

    .pin-back-btn:hover {
      color: var(--text);
    }

    .logout-button {
      background: none;
      border: 1px solid var(--line);
      color: var(--muted);
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 12px;
      cursor: pointer;
      margin-top: 6px;
    }

    .logout-button:hover {
      color: var(--text);
      border-color: var(--line-bright);
    }
  </style>
</head>
<body>
  <section id="screen-picker" hidden>
    <div class="lock-screen">
      <div class="lock-header">
        <h1 class="lock-title">Gym App</h1>
        <p class="lock-subtitle">Quem está treinando?</p>
      </div>
      <div class="profile-list" id="profileList"></div>
    </div>
  </section>

  <section id="screen-pin" hidden>
    <div class="lock-screen">
      <div class="lock-header">
        <h1 class="lock-title" id="pinTitle">—</h1>
        <p class="lock-subtitle" id="pinSubtitle">Digite o PIN</p>
      </div>
      <div class="pin-dots">
        <span class="pin-dot"></span>
        <span class="pin-dot"></span>
        <span class="pin-dot"></span>
        <span class="pin-dot"></span>
      </div>
      <p class="pin-error" id="pinError"></p>
      <div class="pin-keypad">
        <button class="pin-key" type="button" data-digit="1">1</button>
        <button class="pin-key" type="button" data-digit="2">2</button>
        <button class="pin-key" type="button" data-digit="3">3</button>
        <button class="pin-key" type="button" data-digit="4">4</button>
        <button class="pin-key" type="button" data-digit="5">5</button>
        <button class="pin-key" type="button" data-digit="6">6</button>
        <button class="pin-key" type="button" data-digit="7">7</button>
        <button class="pin-key" type="button" data-digit="8">8</button>
        <button class="pin-key" type="button" data-digit="9">9</button>
        <button class="pin-key empty" type="button" tabindex="-1"></button>
        <button class="pin-key" type="button" data-digit="0">0</button>
        <button class="pin-key action" type="button" data-action="back" aria-label="Apagar">⌫</button>
      </div>
      <button class="pin-back-btn" type="button" id="pinBack">← Voltar</button>
    </div>
  </section>

  <div class="app-shell" id="screen-app" hidden>
  <main class="app">
    <header>
      <div class="top-row">
        <div>
          <h1 id="appTitle">Gym App</h1>
          <p class="subtitle" id="appSubtitle">—</p>
          <button class="logout-button" id="logoutBtn" type="button">Trocar usuário</button>
        </div>
        <button class="icon-button" id="resetDay" type="button" title="Limpar treino do dia" aria-label="Limpar treino do dia">
          <span aria-hidden="true">↺</span>
        </button>
      </div>
    </header>

    <nav class="tabs-shell" id="tabsShell" aria-label="Treinos"></nav>

    <section class="workout" id="workout" aria-live="polite"></section>

    <div class="progress-line" aria-hidden="true">
      <span id="progressText">0/0</span>
      <span class="progress-track">
        <span class="progress-fill" id="progressFill" style="--progress: 0%"></span>
      </span>
    </div>
  </main>

  <aside class="rest-bar" aria-label="Cronômetro de descanso">
    <div class="rest-inner">
      <button class="icon-button hidden" id="stopTimer" type="button" title="Zerar descanso" aria-label="Zerar descanso">
        <span aria-hidden="true">×</span>
      </button>
      <div>
        <div class="rest-label">Descanso</div>
        <div class="timer" id="timer">00:00</div>
      </div>
      <div class="rest-actions">
        <button class="rest-button" type="button" data-rest="60">60s</button>
        <button class="rest-button" type="button" data-rest="90">90s</button>
        <button class="rest-button" type="button" data-rest="120">120s</button>
        <button class="rest-button" type="button" data-rest="180">180s</button>
      </div>
    </div>
  </aside>
  </div>

  <script>
    const ACTIVE_KEY = "gym-app-active-profile";
    const todayKey = getLocalDayKey();

    const profiles = {
      jonathan: {
        name: "Jonathan",
        initials: "J",
        accent: "var(--blue)",
        title: "Gym App",
        subtitle: "2 Inferior + 2 Superior + Full Body • Recomposição • Pernas/peito/braços • Ombro protegido • 14/05/2026",
        defaultTab: "lowerA",
        tabs: [
          { key: "lowerA", label: "Seg • Inferior A", color: "var(--green)" },
          { key: "upperA", label: "Ter • Superior A", color: "var(--rose)" },
          { key: "lowerB", label: "Qui • Inferior B", color: "var(--blue)" },
          { key: "upperB", label: "Sex • Superior B", color: "var(--violet)" },
          { key: "fullBody", label: "Sáb • Full Body", color: "var(--green)" },
          { key: "postural", label: "Dom • Postural", color: "var(--violet)" }
        ],
        workouts: {
      lowerA: {
        title: "Segunda • Inferior A • Ênfase quadríceps",
        warmup: "Aquecimento: 5 min cardio + rotação externa ombro elástico 2x15",
        total: "14 séries • ~60 min",

      const y = date.getFullYear();

      return `${y}-${m}-${d}`;

    function hashPin(pin) {
      let h = 5381;
      for (let i = 0; i < pin.length; i++) {
        h = (((h << 5) + h) ^ pin.charCodeAt(i)) >>> 0;
      }
      return String(h);
    }

    function renderMovementMedia(exercise) {
      const media = EXERCISE_MEDIA[exercise.id];
      if (!media) return "";
      const alt = `${exercise.name}: simulação visual do movimento`;
      const src = `${EXERCISE_MEDIA_BASE}${media.id}.gif`;
      return `<img class="movement-image" src="${src}" alt="${escapeHtml(alt)}" title="${escapeHtml(media.label)}" loading="lazy" decoding="async" onerror="this.closest('.exercise-visual').classList.add('media-error'); this.remove();">`;
    }

    /* === State === */
    let currentProfile = null;
    let activeTab = null;
    let state = null;
    let timerId = null;
    let timerEndsAt = 0;
    let activeRest = 0;

    let pinScreenMode = "enter";
    let pinScreenProfile = null;
    let pinFirstAttempt = "";
    let pinBuffer = "";

    const screenPicker = document.querySelector("#screen-picker");
    const screenPin = document.querySelector("#screen-pin");
    const screenApp = document.querySelector("#screen-app");
    const workoutEl = document.querySelector("#workout");
    const timerEl = document.querySelector("#timer");
    const progressText = document.querySelector("#progressText");
    const progressFill = document.querySelector("#progressFill");
    const stopTimer = document.querySelector("#stopTimer");

    function loadProfileState(profileId) {
      const profile = profiles[profileId];
      try {
        const parsed = JSON.parse(localStorage.getItem(profileStateKey(profileId))) || {};
        if (parsed.day !== todayKey) {
          return { day: todayKey, activeTab: parsed.activeTab || profile.defaultTab, weights: parsed.weights || {}, done: {} };
        }
        return { day: todayKey, weights: {}, done: {}, activeTab: profile.defaultTab, ...parsed };
      } catch {
        return { day: todayKey, weights: {}, done: {}, activeTab: profile.defaultTab };
      }
    }

    function saveProfileState() {
      if (!currentProfile) return;
      state.activeTab = activeTab;
      localStorage.setItem(profileStateKey(currentProfile), JSON.stringify(state));
    }

    function showScreen(name) {
      screenPicker.hidden = name !== "picker";
      screenPin.hidden = name !== "pin";
      screenApp.hidden = name !== "app";
    }

    /* === Profile picker === */
    function renderProfilePicker() {
      const list = document.querySelector("#profileList");
      list.innerHTML = "";
      Object.entries(profiles).forEach(([id, profile]) => {
        const card = document.createElement("button");
        card.className = "profile-card";
        card.type = "button";
        card.style.setProperty("--profile-color", profile.accent);
        card.dataset.profile = id;
        const hasPin = !!localStorage.getItem(profilePinKey(id));
        card.innerHTML = `
          <span class="profile-avatar">${profile.initials}</span>
          <span class="profile-info">
            <span class="profile-name">${profile.name}</span>
            <span class="profile-meta">${hasPin ? "Toque para entrar" : "Configurar PIN"}</span>
          </span>
        `;
        card.addEventListener("click", () => openPinScreen(id));
        list.appendChild(card);
      });
    }

    /* === PIN screen === */
    function openPinScreen(profileId) {
      pinScreenProfile = profileId;
      pinBuffer = "";
      pinFirstAttempt = "";
      const hasPin = !!localStorage.getItem(profilePinKey(profileId));
      pinScreenMode = hasPin ? "enter" : "setup";
      setPinError("");
      renderPinScreen();
      showScreen("pin");
    }

    function renderPinScreen() {
      const profile = profiles[pinScreenProfile];
      document.querySelector("#pinTitle").textContent = profile.name;
      let subtitle = "Digite seu PIN";
      if (pinScreenMode === "setup") subtitle = "Defina um PIN de 4 dígitos";
      if (pinScreenMode === "confirm") subtitle = "Confirme o PIN";
      document.querySelector("#pinSubtitle").textContent = subtitle;
      document.querySelectorAll("#screen-pin .pin-dot").forEach((dot, i) => {
        dot.classList.toggle("filled", i < pinBuffer.length);
      });
    }

    function pinPress(digit) {
      if (pinBuffer.length >= 4) return;
      pinBuffer += digit;
      renderPinScreen();
      if (pinBuffer.length === 4) {
        setTimeout(processPinSubmit, 120);
      }
    }

    function pinBackspace() {
      pinBuffer = pinBuffer.slice(0, -1);
      renderPinScreen();
    }

    function setPinError(msg) {
      const el = document.querySelector("#pinError");
      if (el) el.textContent = msg;
    }

    function processPinSubmit() {
      if (pinScreenMode === "enter") {
        const stored = localStorage.getItem(profilePinKey(pinScreenProfile));
        if (hashPin(pinBuffer) === stored) {
          setPinError("");
          enterApp(pinScreenProfile);
        } else {
          pinBuffer = "";
          renderPinScreen();
          setPinError("PIN incorreto. Tente de novo.");
        }
      } else if (pinScreenMode === "setup") {
        pinFirstAttempt = pinBuffer;
        pinBuffer = "";
        pinScreenMode = "confirm";
        setPinError("");
        renderPinScreen();
      } else if (pinScreenMode === "confirm") {
        if (pinBuffer === pinFirstAttempt) {
          localStorage.setItem(profilePinKey(pinScreenProfile), hashPin(pinBuffer));
          setPinError("");
          enterApp(pinScreenProfile);
        } else {
          pinBuffer = "";
          pinFirstAttempt = "";
          pinScreenMode = "setup";
          renderPinScreen();
          setPinError("PINs não combinaram. Crie um novo.");
        }
      }
    }

    /* === Enter / leave app === */
    function enterApp(profileId) {
      currentProfile = profileId;
      localStorage.setItem(ACTIVE_KEY, profileId);
      state = loadProfileState(profileId);
      const profile = profiles[profileId];
      activeTab = profile.workouts[state.activeTab] ? state.activeTab : profile.defaultTab;
      renderApp();
      showScreen("app");
    }

    function logout() {
      saveProfileState();
      stopRest();
      currentProfile = null;
      state = null;
      activeTab = null;
      localStorage.removeItem(ACTIVE_KEY);
      renderProfilePicker();
      showScreen("picker");
    }

    /* === Render === */
    function renderApp() {
      const profile = profiles[currentProfile];
      document.querySelector("#appTitle").textContent = profile.title;
      document.querySelector("#appSubtitle").textContent = profile.subtitle;
      const tabsShell = document.querySelector("#tabsShell");
      tabsShell.innerHTML = "";
      profile.tabs.forEach((tab) => {
        const btn = document.createElement("button");
        btn.className = "tab";
        btn.type = "button";
        btn.dataset.tab = tab.key;
        btn.style.setProperty("--tab-color", tab.color);
        btn.setAttribute("aria-selected", String(tab.key === activeTab));
        btn.innerHTML = `<span class="tab-dot" aria-hidden="true"></span><span class="tab-label">${tab.label}</span>`;
        btn.addEventListener("click", () => {
          activeTab = tab.key;
          saveProfileState();
          renderWorkout();
        });
        tabsShell.appendChild(btn);
      });
      renderWorkout();
    }

    function renderTabs() {
      document.querySelectorAll("#tabsShell .tab").forEach((tab) => {
        tab.setAttribute("aria-selected", String(tab.dataset.tab === activeTab));
      });
      const activeButton = document.querySelector("#tabsShell .tab[aria-selected='true']");
      if (activeButton) {
        activeButton.scrollIntoView({ behavior: "smooth", block: "nearest", inline: "nearest" });
      }
    }

    function renderWorkout() {
      const profile = profiles[currentProfile];
      const workout = profile.workouts[activeTab];
      renderTabs();
      workoutEl.innerHTML = "";

      const summary = document.createElement("div");
      summary.className = "day-summary";
      summary.innerHTML = `
        <p class="day-kicker">${workout.total}</p>
        <h2>${workout.title}</h2>
        ${workout.warmup ? `<p>${workout.warmup}</p>` : ""}
      `;
      workoutEl.appendChild(summary);

      workout.exercises.forEach((exercise) => {
        const article = document.createElement("article");
        article.className = `exercise${state.done[exercise.id] ? " done" : ""}`;
        article.dataset.id = exercise.id;
        article.innerHTML = `
          <div class="exercise-main">
            <h2 class="exercise-title">${exercise.name}</h2>
            <p class="exercise-note">${exercise.note}</p>
            <div class="metrics">
              <div>
                <span class="metric-label">Séries</span>
                <div class="metric-value">${exercise.sets}</div>
              </div>
              <div>
                <span class="metric-label">Reps</span>
                <div class="metric-value">${exercise.reps}</div>
              </div>
              <div>
                <span class="metric-label">RIR</span>
                <div class="metric-value">${exercise.rir}</div>
              </div>
              <div>
                <span class="metric-label">Descanso</span>
                <div class="metric-value">${exercise.restLabel}</div>
              </div>
            </div>
            ${exercise.trackWeight === false ? "" : `
              <div class="weight-row">
                <label class="weight-label" for="weight-${exercise.id}">Carga (kg)</label>
                <input class="weight-input" id="weight-${exercise.id}" inputmode="decimal" autocomplete="off" value="${state.weights[exercise.id] || ""}">
              </div>
            `}
          </div>
          <figure class="exercise-visual">
            ${renderMovementMedia(exercise)}
          </figure>
          <button class="done-button" type="button" title="Concluir exercício" aria-label="Concluir ${exercise.name}">
            <span class="check-ring" aria-hidden="true"></span>
          </button>
        `;
        const weightInput = article.querySelector(".weight-input");
        if (weightInput) {
          weightInput.addEventListener("input", (event) => {
            state.weights[exercise.id] = event.target.value.trim();
            saveProfileState();
          });
        }
        article.querySelector(".done-button").addEventListener("click", () => {
          const nextValue = !state.done[exercise.id];
          state.done[exercise.id] = nextValue;
          article.classList.toggle("done", nextValue);
          if (nextValue && exercise.restSeconds > 0) startRest(exercise.restSeconds);
          saveProfileState();
          updateProgress();
        });
        workoutEl.appendChild(article);
      });
      updateProgress();
    }

    function updateProgress() {
      const profile = profiles[currentProfile];
      const exercises = profile.workouts[activeTab].exercises;
      const done = exercises.filter((e) => state.done[e.id]).length;
      const total = exercises.length;
      progressText.textContent = `${done}/${total}`;
      progressFill.style.setProperty("--progress", `${total ? (done / total) * 100 : 0}%`);
    }

    /* === Timer === */
    function formatTime(totalSeconds) {
      const seconds = Math.max(0, Math.ceil(totalSeconds));
      const minutes = Math.floor(seconds / 60);
      const restSeconds = seconds % 60;
      return `${String(minutes).padStart(2, "0")}:${String(restSeconds).padStart(2, "0")}`;
    }

    function startRest(seconds) {
      activeRest = seconds;
      timerEndsAt = Date.now() + seconds * 1000;
      document.querySelectorAll(".rest-button").forEach((b) => {
        b.classList.toggle("active", Number(b.dataset.rest) === seconds);
      });
      stopTimer.classList.remove("hidden");
      tickTimer();
      clearInterval(timerId);
      timerId = setInterval(tickTimer, 250);
    }

    function stopRest() {
      clearInterval(timerId);
      timerId = null;
      timerEndsAt = 0;
      activeRest = 0;
      if (timerEl) {
        timerEl.textContent = "00:00";
        timerEl.classList.remove("running");
      }
      if (stopTimer) stopTimer.classList.add("hidden");
      document.querySelectorAll(".rest-button").forEach((b) => b.classList.remove("active"));
    }

    function tickTimer() {
      const remaining = (timerEndsAt - Date.now()) / 1000;
      timerEl.textContent = formatTime(remaining);
      timerEl.classList.toggle("running", remaining > 0);
      if (remaining <= 0) {
        clearInterval(timerId);
        timerId = null;
        if (activeRest) {
          timerEl.textContent = "00:00";
          stopTimer.classList.add("hidden");
          document.querySelectorAll(".rest-button").forEach((b) => b.classList.remove("active"));
        }
      }
    }

    /* === Wiring === */
    document.querySelectorAll(".rest-button").forEach((b) => {
      b.addEventListener("click", () => startRest(Number(b.dataset.rest)));
    });

    stopTimer.addEventListener("click", stopRest);

    document.querySelector("#resetDay").addEventListener("click", () => {
      if (!state) return;
      state.done = {};
      state.day = todayKey;
      stopRest();
      saveProfileState();
      renderWorkout();
    });

    document.querySelector("#logoutBtn").addEventListener("click", logout);

    document.querySelectorAll("#screen-pin .pin-key").forEach((btn) => {
      btn.addEventListener("click", () => {
        if (btn.dataset.action === "back") pinBackspace();
        else if (btn.dataset.digit) pinPress(btn.dataset.digit);
      });
    });

    document.querySelector("#pinBack").addEventListener("click", () => {
      pinBuffer = "";
      pinFirstAttempt = "";
      setPinError("");
      showScreen("picker");
    });

    /* === Init === */
    (function init() {
      const active = localStorage.getItem(ACTIVE_KEY);
      if (active && profiles[active] && localStorage.getItem(profilePinKey(active))) {
        enterApp(active);
      } else {
        renderProfilePicker();
        showScreen("picker");
      }
    })();
  </script>
</body>
</html>

<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#070c1b">
  <title>Gym App</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #070c1b;
      --panel: #0f1728;
      --panel-soft: #1a2435;
      --line: #263757;
      --line-bright: #46c3ff;
      --text: #f7fbff;
      --muted: #9eb7d7;
      --dim: #6d83a7;
      --blue: #46c3ff;
      --green: #41d99a;
      --violet: #8592ff;
      --rose: #ff6b96;
      --shadow: 0 18px 60px rgba(0, 0, 0, .2);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: var(--bg);
    }

    body {
      min-height: 100%;
      margin: 0;
      padding: 18px 0 88px;
      background:
        radial-gradient(circle at 16% 0%, rgba(70, 195, 255, .08), transparent 28rem),
        linear-gradient(180deg, #050917 0%, #071022 100%);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 0;
    }

    button,
    input {
      font: inherit;
    }

    button {
      -webkit-tap-highlight-color: transparent;
    }

    .app {
      width: min(100% - 28px, 736px);
      margin: 0 auto;
    }

    header {
      display: grid;
      gap: 4px;
      margin-bottom: 28px;
    }

    h1 {
      margin: 0;
      color: #63ceff;
      font-size: 24px;
      line-height: 1.08;
      font-weight: 780;
    }

    .subtitle {
      margin: 0;
      color: #bfd1ea;
      font-size: 13px;
      line-height: 1.5;
    }

    .top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .icon-button {
      display: grid;
      width: 38px;
      height: 38px;
      min-width: 38px;
      place-items: center;
      border: 1px solid rgba(116, 147, 190, .42);
      border-radius: 8px;
      background: rgba(9, 15, 32, .76);
      color: #9bdcff;
      cursor: pointer;
    }

    .icon-button:active {
      transform: translateY(1px);
    }

    .tabs-shell {
      display: inline-flex;
      max-width: 100%;
      margin-bottom: 20px;
      padding: 4px;
      border: 1px solid #283a5d;
      border-radius: 999px;
      background: rgba(8, 14, 30, .86);
      box-shadow: inset 0 0 0 1px rgba(82, 116, 164, .15);
      overflow-x: auto;
      scrollbar-width: none;
    }

    .tabs-shell::-webkit-scrollbar {
      display: none;
    }

    .tab {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      min-height: 32px;
      min-width: max-content;
      padding: 0 18px;
      border: 1px solid transparent;
      border-radius: 999px;
      background: transparent;
      color: #93a7c8;
      font-size: 13px;
      font-weight: 650;
      cursor: pointer;
    }

    .tab-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--tab-color);
      box-shadow: 0 0 16px var(--tab-color);
    }

    .tab[aria-selected="true"] {
      border-color: var(--blue);
      color: #ffffff;
      background: rgba(70, 195, 255, .08);
      box-shadow: 0 0 0 1px rgba(70, 195, 255, .15), inset 0 0 18px rgba(70, 195, 255, .08);
    }

    .workout {
      display: grid;
      gap: 12px;
    }

    .day-summary {
      display: grid;
      gap: 4px;
      padding: 2px 0 4px;
    }

    .day-summary h2 {
      margin: 0;
      color: #ffffff;
      font-size: 18px;
      line-height: 1.25;
      font-weight: 780;
    }

    .day-summary p {
      margin: 0;
      color: #9fc4e8;
      font-size: 12px;
      line-height: 1.45;
    }

    .day-kicker {
      color: #63ceff;
      font-size: 10px;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    .exercise {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 18px;
      min-height: 170px;
      padding: 20px 16px 16px;
      border: 1px solid rgba(62, 85, 126, .78);
      border-radius: 12px;
      background: linear-gradient(90deg, var(--panel-soft) 0%, #0c1324 36%, #080d1e 100%);
      box-shadow: var(--shadow);
      transition: border-color .18s ease, background .18s ease, transform .18s ease;
    }

    .exercise.done {
      border-color: rgba(65, 217, 154, .56);
      background:
        linear-gradient(90deg, rgba(25, 46, 49, .92) 0%, rgba(12, 26, 35, .96) 38%, #080d1e 100%);
    }

    .exercise-main {
      min-width: 0;
    }

    .exercise-title {
      margin: 0 0 3px;
      color: #ffffff;
      font-size: 16px;
      line-height: 1.28;
      font-weight: 780;
    }

    .exercise-note {
      margin: 0 0 16px;
      color: #9fc4e8;
      font-size: 12px;
      line-height: 1.45;
    }

    .metrics {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px 20px;
      margin-bottom: 18px;
    }

    .metric-label,
    label.weight-label {
      display: block;
      color: #7890b6;
      font-size: 9px;
      line-height: 1;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    .metric-value {
      margin-top: 7px;
      color: #ffffff;
      font-size: 14px;
      line-height: 1;
      font-weight: 760;
    }

    .weight-row {
      display: grid;
      grid-template-columns: 74px minmax(96px, 1fr);
      align-items: center;
      gap: 10px;
      max-width: 210px;
    }

    .weight-input {
      width: 96px;
      height: 31px;
      padding: 0 10px;
      border: 1px solid #53627c;
      border-radius: 6px;
      background: #070b19;
      color: #ffffff;
      outline: none;
      font-size: 14px;
      font-weight: 680;
    }

    .weight-input:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(70, 195, 255, .16);
    }

    .done-button {
      display: grid;
      width: 31px;
      height: 31px;
      min-width: 31px;
      place-items: center;
      margin-top: 1px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: #87caff;
      cursor: pointer;
    }

    .check-ring {
      display: grid;
      width: 19px;
      height: 19px;
      place-items: center;
      border: 2px solid currentColor;
      border-radius: 50%;
      color: #86bfff;
      font-size: 12px;
      line-height: 1;
      font-weight: 900;
    }

    .done .check-ring {
      color: var(--green);
    }

    .done .check-ring::before {
      content: "";
      width: 7px;
      height: 4px;
      margin-top: -2px;
      border-left: 2px solid currentColor;
      border-bottom: 2px solid currentColor;
      transform: rotate(-45deg);
    }

    .progress-line {
      display: flex;
      align-items: center;
      gap: 9px;
      margin-top: 10px;
      color: #8299bc;
      font-size: 11px;
      font-weight: 680;
    }

    .progress-track {
      position: relative;
      flex: 1;
      height: 4px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(75, 96, 134, .34);
    }

    .progress-fill {
      position: absolute;
      inset: 0 auto 0 0;
      width: var(--progress);
      border-radius: inherit;
      background: linear-gradient(90deg, #41d99a, #46c3ff);
    }

    .rest-bar {
      position: fixed;
      right: 0;
      bottom: 0;
      left: 0;
      z-index: 5;
      min-height: calc(62px + var(--safe-bottom));
      padding: 12px max(18px, env(safe-area-inset-right, 0px)) calc(12px + var(--safe-bottom)) max(18px, env(safe-area-inset-left, 0px));
      border-top: 1px solid #263653;
      background: rgba(13, 22, 39, .97);
      backdrop-filter: blur(18px);
      box-shadow: 0 -18px 42px rgba(0, 0, 0, .28);
    }

    .rest-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      width: min(100%, 736px);
      margin: 0 auto;
    }

    .rest-label {
      color: #8da5c8;
      font-size: 10px;
      line-height: 1;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    .timer {
      margin-top: 6px;
      color: #5dcfff;
      font-variant-numeric: tabular-nums;
      font-size: 18px;
      line-height: 1;
      font-weight: 780;
    }

    .timer.running {
      color: #ffffff;
    }

    .rest-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      min-width: 0;
    }

    .rest-button {
      display: inline-grid;
      min-width: 54px;
      height: 34px;
      place-items: center;
      padding: 0 14px;
      border: 1px solid #0ea5e9;
      border-radius: 999px;
      background: rgba(14, 165, 233, .06);
      color: #9ee3ff;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    .rest-button:active,
    .rest-button.active {
      background: rgba(14, 165, 233, .18);
      color: #ffffff;
      transform: translateY(1px);
    }

    .hidden {
      display: none;
    }

    @media (max-width: 560px) {
      body {
        padding-top: 16px;
      }

      .app {
        width: min(100% - 24px, 736px);
      }

      header {
        margin-bottom: 22px;
      }

      h1 {
        font-size: 23px;
      }

      .subtitle {
        max-width: 310px;
      }

      .tabs-shell {
        width: 100%;
      }

      .tab {
        flex: 1 0 auto;
        padding: 0 14px;
      }

      .exercise {
        min-height: 166px;
        padding: 18px 14px 15px;
        border-radius: 11px;
      }

      .metrics {
        grid-template-columns: repeat(2, minmax(96px, 1fr));
        gap: 12px;
      }

      .weight-row {
        grid-template-columns: 74px 96px;
      }

      .rest-inner {
        gap: 12px;
      }

      .rest-actions {
        min-width: 0;
        gap: 7px;
      }

      .rest-button {
        min-width: 44px;
        height: 34px;
        padding: 0 8px;
        font-size: 12px;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div class="top-row">
        <div>
          <h1>Gym App</h1>
          <p class="subtitle">Treino Upper / Lower v4 — Low Volume / High Intensity • 4 dias on • RIR 0–1</p>
        </div>
        <button class="icon-button" id="resetDay" type="button" title="Limpar treino do dia" aria-label="Limpar treino do dia">
          <span aria-hidden="true">↺</span>
        </button>
      </div>
    </header>

    <nav class="tabs-shell" aria-label="Treinos">
      <button class="tab" type="button" data-tab="upperA" aria-selected="true" style="--tab-color: var(--rose)">
        <span class="tab-dot" aria-hidden="true"></span>
        Seg • Upper A
      </button>
      <button class="tab" type="button" data-tab="lowerA" aria-selected="false" style="--tab-color: var(--green)">
        <span class="tab-dot" aria-hidden="true"></span>
        Ter • Lower A
      </button>
      <button class="tab" type="button" data-tab="upperB" aria-selected="false" style="--tab-color: var(--violet)">
        <span class="tab-dot" aria-hidden="true"></span>
        Qui • Upper B
      </button>
      <button class="tab" type="button" data-tab="lowerB" aria-selected="false" style="--tab-color: var(--blue)">
        <span class="tab-dot" aria-hidden="true"></span>
        Sex • Lower B
      </button>
    </nav>

    <section class="workout" id="workout" aria-live="polite"></section>

    <div class="progress-line" aria-hidden="true">
      <span id="progressText">0/0</span>
      <span class="progress-track">
        <span class="progress-fill" id="progressFill" style="--progress: 0%"></span>
      </span>
    </div>
  </main>

  <aside class="rest-bar" aria-label="Cronômetro de descanso">
    <div class="rest-inner">
      <button class="icon-button hidden" id="stopTimer" type="button" title="Zerar descanso" aria-label="Zerar descanso">
        <span aria-hidden="true">×</span>
      </button>
      <div>
        <div class="rest-label">Descanso</div>
        <div class="timer" id="timer">00:00</div>
      </div>
      <div class="rest-actions">
        <button class="rest-button" type="button" data-rest="60">60s</button>
        <button class="rest-button" type="button" data-rest="90">90s</button>
        <button class="rest-button" type="button" data-rest="120">120s</button>
        <button class="rest-button" type="button" data-rest="180">180s</button>
      </div>
    </div>
  </aside>

  <script>
    const STORAGE_KEY = "gym-app-jonathan-v1";
    const todayKey = getLocalDayKey();

    const workouts = {
      upperA: {
        title: "Segunda • Upper A • Push + Costas",
        warmup: "Aquecimento: 5 min cardio + rotação externa elástico 2x15",
        total: "14 séries • ~55 min",
        exercises: [
          { id: "upper-a-incline-db", name: "Supino inclinado halter neutro", note: "Press principal, ombro-friendly", sets: "2", reps: "6–8", rir: "0–1", restLabel: "2–3 min", restSeconds: 180 },
          { id: "upper-a-row", name: "Remada curvada barra ou apoiada", note: "Espessura", sets: "2", reps: "6–8", rir: "1", restLabel: "2–3 min", restSeconds: 180 },
          { id: "upper-a-shoulder-db", name: "Desenvolvimento halter neutro sentado", note: "Delt anterior + médio", sets: "2", reps: "8–10", rir: "0–1", restLabel: "2 min", restSeconds: 120 },
          { id: "upper-a-pulldown", name: "Pulldown neutro ou pegada média", note: "Lats vertical", sets: "2", reps: "8–10", rir: "0–1", restLabel: "90 s", restSeconds: 90 },
          { id: "upper-a-face-pull", name: "Face pull corda", note: "Delt posterior + escapular", sets: "2", reps: "15–20", rir: "0", restLabel: "60 s", restSeconds: 60 },
          { id: "upper-a-triceps", name: "Tríceps testa ou francês", note: "Tríceps composto", sets: "2", reps: "8–10", rir: "0", restLabel: "60–90 s", restSeconds: 90 },
          { id: "upper-a-curl", name: "Rosca direta", note: "Bíceps base", sets: "2", reps: "8–10", rir: "0", restLabel: "60–90 s", restSeconds: 90 }
        ]
      },
      lowerA: {
        title: "Terça • Lower A • Quadríceps dominante",
        total: "11 séries • ~50 min",
        exercises: [
          { id: "lower-a-squat", name: "Agachamento livre ou hack squat", note: "Pesado da semana", sets: "2", reps: "5–8", rir: "1–2", restLabel: "2–3 min", restSeconds: 180 },
          { id: "lower-a-leg-press", name: "Leg press 45", note: "Quad complementar, pés médios", sets: "2", reps: "8–12", rir: "0–1", restLabel: "2 min", restSeconds: 120 },
          { id: "lower-a-ext", name: "Cadeira extensora", note: "Isolado, controle excêntrico", sets: "2", reps: "10–15", rir: "0", restLabel: "90 s", restSeconds: 90 },
          { id: "lower-a-curl", name: "Mesa flexora", note: "Posterior isolado", sets: "2", reps: "10–12", rir: "0", restLabel: "90 s", restSeconds: 90 },
          { id: "lower-a-calf", name: "Panturrilha em pé", note: "Gastrocnêmio, amplitude completa", sets: "3", reps: "10–15", rir: "0", restLabel: "60 s", restSeconds: 60 }
        ]
      },
      upperB: {
        title: "Quinta • Upper B • Pull + Ombros",
        warmup: "Aquecimento: 5 min cardio + rotação externa elástico 2x15",
        total: "14 séries • ~55 min",
        exercises: [
          { id: "upper-b-low-row", name: "Remada baixa cabo neutra", note: "Espessura, pega diferente", sets: "2", reps: "8–10", rir: "0–1", restLabel: "2 min", restSeconds: 120 },
          { id: "upper-b-chest-machine", name: "Supino reto máquina ou convergente", note: "Peito, ombro-friendly", sets: "2", reps: "8–10", rir: "0–1", restLabel: "2 min", restSeconds: 120 },
          { id: "upper-b-pulldown-wide", name: "Pulldown pegada larga", note: "Lats - pega diferente da segunda", sets: "2", reps: "10–12", rir: "0", restLabel: "90 s", restSeconds: 90 },
          { id: "upper-b-reverse-fly", name: "Crucifixo invertido máquina", note: "Delt posterior direto", sets: "2", reps: "12–15", rir: "0", restLabel: "75 s", restSeconds: 75 },
          { id: "upper-b-lateral", name: "Elevação lateral cabo ou halter", note: "Última série pode RIR -1", sets: "2", reps: "12–15", rir: "0", restLabel: "60 s", restSeconds: 60 },
          { id: "upper-b-hammer", name: "Rosca martelo", note: "Bíceps + braquial", sets: "2", reps: "10–12", rir: "0", restLabel: "60 s", restSeconds: 60 },
          { id: "upper-b-triceps-rope", name: "Tríceps corda", note: "Tríceps complemento", sets: "2", reps: "10–12", rir: "0", restLabel: "60 s", restSeconds: 60 }
        ]
      },
      lowerB: {
        title: "Sexta • Lower B • Hinge + Glúteo",
        total: "13 séries • ~55 min",
        exercises: [
          { id: "lower-b-rdl", name: "Terra romeno barra", note: "Hinge pesado, cadeia posterior", sets: "2", reps: "6–8", rir: "1", restLabel: "2–3 min", restSeconds: 180 },
          { id: "lower-b-hip-thrust", name: "Hip thrust barra ou Smith", note: "Glúteo direto, pausa 1s no topo", sets: "2", reps: "8–10", rir: "0–1", restLabel: "90 s", restSeconds: 90 },
          { id: "lower-b-front-squat", name: "Front squat ou leg press unilateral", note: "Quad complemento", sets: "2", reps: "8–10", rir: "0–1", restLabel: "2 min", restSeconds: 120 },
          { id: "lower-b-stiff-db", name: "Stiff com halteres", note: "Posterior complemento", sets: "2", reps: "10–12", rir: "0", restLabel: "90 s", restSeconds: 90 },
          { id: "lower-b-abductor", name: "Abdutor máquina ou cabo", note: "Glúteo médio", sets: "2", reps: "15–20", rir: "0", restLabel: "60 s", restSeconds: 60 },
          { id: "lower-b-seated-calf", name: "Panturrilha sentada", note: "Sóleo, tempo sob tensão", sets: "3", reps: "12–20", rir: "0", restLabel: "60 s", restSeconds: 60 }
        ]
      }
    };

    const state = loadState();
    let activeTab = workouts[state.activeTab] ? state.activeTab : "upperA";
    let timerId = null;
    let timerEndsAt = 0;
    let activeRest = 0;

    const workoutEl = document.querySelector("#workout");
    const timerEl = document.querySelector("#timer");
    const progressText = document.querySelector("#progressText");
    const progressFill = document.querySelector("#progressFill");
    const stopTimer = document.querySelector("#stopTimer");

    function loadState() {
      try {
        const parsed = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
        if (parsed.day !== todayKey) {
          return { day: todayKey, activeTab: parsed.activeTab || "upperA", weights: parsed.weights || {}, done: {} };
        }
        return { day: todayKey, weights: {}, done: {}, activeTab: "upperA", ...parsed };
      } catch {
        return { day: todayKey, weights: {}, done: {}, activeTab: "upperA" };
      }
    }

    function getLocalDayKey(date = new Date()) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, "0");
      const day = String(date.getDate()).padStart(2, "0");
      return `${year}-${month}-${day}`;
    }

    function saveState() {
      state.activeTab = activeTab;
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function renderTabs() {
      document.querySelectorAll(".tab").forEach((tab) => {
        tab.setAttribute("aria-selected", String(tab.dataset.tab === activeTab));
      });
    }

    function renderWorkout() {
      renderTabs();
      workoutEl.innerHTML = "";
      const workout = workouts[activeTab];

      const summary = document.createElement("div");
      summary.className = "day-summary";
      summary.innerHTML = `
        <p class="day-kicker">${workout.total}</p>
        <h2>${workout.title}</h2>
        ${workout.warmup ? `<p>${workout.warmup}</p>` : ""}
      `;
      workoutEl.appendChild(summary);

      workout.exercises.forEach((exercise) => {
        const article = document.createElement("article");
        article.className = `exercise${state.done[exercise.id] ? " done" : ""}`;
        article.dataset.id = exercise.id;

        article.innerHTML = `
          <div class="exercise-main">
            <h2 class="exercise-title">${exercise.name}</h2>
            <p class="exercise-note">${exercise.note}</p>

            <div class="metrics">
              <div>
                <span class="metric-label">Séries</span>
                <div class="metric-value">${exercise.sets}</div>
              </div>
              <div>
                <span class="metric-label">Reps</span>
                <div class="metric-value">${exercise.reps}</div>
              </div>
              <div>
                <span class="metric-label">RIR</span>
                <div class="metric-value">${exercise.rir}</div>
              </div>
              <div>
                <span class="metric-label">Descanso</span>
                <div class="metric-value">${exercise.restLabel}</div>
              </div>
            </div>

            <div class="weight-row">
              <label class="weight-label" for="weight-${exercise.id}">Carga (kg)</label>
              <input class="weight-input" id="weight-${exercise.id}" inputmode="decimal" autocomplete="off" value="${state.weights[exercise.id] || ""}">
            </div>
          </div>

          <button class="done-button" type="button" title="Concluir exercício" aria-label="Concluir ${exercise.name}">
            <span class="check-ring" aria-hidden="true"></span>
          </button>
        `;

        article.querySelector(".weight-input").addEventListener("input", (event) => {
          state.weights[exercise.id] = event.target.value.trim();
          saveState();
        });

        article.querySelector(".done-button").addEventListener("click", () => {
          const nextValue = !state.done[exercise.id];
          state.done[exercise.id] = nextValue;
          article.classList.toggle("done", nextValue);
          if (nextValue) {
            startRest(exercise.restSeconds);
          }
          saveState();
          updateProgress();
        });

        workoutEl.appendChild(article);
      });

      updateProgress();
    }

    function updateProgress() {
      const exercises = workouts[activeTab].exercises;
      const done = exercises.filter((exercise) => state.done[exercise.id]).length;
      const total = exercises.length;
      progressText.textContent = `${done}/${total}`;
      progressFill.style.setProperty("--progress", `${total ? (done / total) * 100 : 0}%`);
    }

    function formatTime(totalSeconds) {
      const seconds = Math.max(0, Math.ceil(totalSeconds));
      const minutes = Math.floor(seconds / 60);
      const restSeconds = seconds % 60;
      return `${String(minutes).padStart(2, "0")}:${String(restSeconds).padStart(2, "0")}`;
    }

    function startRest(seconds) {
      activeRest = seconds;
      timerEndsAt = Date.now() + seconds * 1000;
      document.querySelectorAll(".rest-button").forEach((button) => {
        button.classList.toggle("active", Number(button.dataset.rest) === seconds);
      });
      stopTimer.classList.remove("hidden");
      tickTimer();
      clearInterval(timerId);
      timerId = setInterval(tickTimer, 250);
    }

    function stopRest() {
      clearInterval(timerId);
      timerId = null;
      timerEndsAt = 0;
      activeRest = 0;
      timerEl.textContent = "00:00";
      timerEl.classList.remove("running");
      stopTimer.classList.add("hidden");
      document.querySelectorAll(".rest-button").forEach((button) => button.classList.remove("active"));
    }

    function tickTimer() {
      const remaining = (timerEndsAt - Date.now()) / 1000;
      timerEl.textContent = formatTime(remaining);
      timerEl.classList.toggle("running", remaining > 0);
      if (remaining <= 0) {
        clearInterval(timerId);
        timerId = null;
        if (activeRest) {
          timerEl.textContent = "00:00";
          stopTimer.classList.add("hidden");
          document.querySelectorAll(".rest-button").forEach((button) => button.classList.remove("active"));
        }
      }
    }

    document.querySelectorAll(".tab").forEach((tab) => {
      tab.addEventListener("click", () => {
        activeTab = tab.dataset.tab;
        saveState();
        renderWorkout();
      });
    });

    document.querySelectorAll(".rest-button").forEach((button) => {
      button.addEventListener("click", () => startRest(Number(button.dataset.rest)));
    });

    stopTimer.addEventListener("click", stopRest);

    document.querySelector("#resetDay").addEventListener("click", () => {
      state.done = {};
      state.day = todayKey;
      stopRest();
      saveState();
      renderWorkout();
    });

    renderWorkout();
  </script>
</body>
</html>

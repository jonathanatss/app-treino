<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101010">
  <meta name="description" content="Treinos personalizados com perfis, séries, descanso, cargas e imagens dos movimentos.">

  <meta property="og:title" content="FitPlan">
  <meta property="og:description" content="Acompanhe treinos personalizados por perfil, com séries, repetições, descanso, cargas e imagens dos exercícios.">
  <meta property="og:image" content="https://app-treino-jonathan.netlify.app/icon-512-v2.png">
  <meta property="og:url" content="https://app-treino-jonathan.netlify.app/">
  <meta property="og:site_name" content="FitPlan">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="FitPlan">
  <meta name="twitter:description" content="Treinos personalizados por perfil, com séries, descanso, cargas e imagens dos exercícios.">
  <meta name="twitter:image" content="https://app-treino-jonathan.netlify.app/icon-512-v2.png">
  <title>FitPlan</title>

  <!-- PWA / iOS Add to Home Screen -->
  <link rel="manifest" href="manifest.webmanifest?v=2">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon-v2.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32-v2.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192-v2.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FitPlan">

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

</head>
<body>
  <section id="screen-picker" hidden>
    <div class="lock-screen">
      <div class="lock-header">
        <img class="lock-logo" src="logo-mark.svg" alt="" aria-hidden="true">
        <h1 class="lock-title">Acesse o FitPlan</h1>
        <p class="lock-subtitle">Entre com seu e-mail para carregar o seu treino.</p>
      </div>
      <div class="profile-list" id="profileList"></div>
    </div>
  </section>

  <section id="screen-pin" hidden>
    <div class="lock-screen">
      <div class="lock-header">
        <img class="lock-logo" src="logo-mark.svg" alt="" aria-hidden="true">
        <h1 class="lock-title" id="pinTitle">—</h1>
        <p class="lock-subtitle" id="pinSubtitle">Digite o PIN</p>
      </div>
      <div class="pin-dots">
        <span class="pin-dot"></span>
        <span class="pin-dot"></span>
        <span class="pin-dot"></span>
        <span class="pin-dot"></span>
      </div>
      <p class="pin-error" id="pinError"></p>
      <div class="pin-keypad">
        <button class="pin-key" type="button" data-digit="1">1</button>
        <button class="pin-key" type="button" data-digit="2">2</button>
        <button class="pin-key" type="button" data-digit="3">3</button>
        <button class="pin-key" type="button" data-digit="4">4</button>
        <button class="pin-key" type="button" data-digit="5">5</button>
        <button class="pin-key" type="button" data-digit="6">6</button>
        <button class="pin-key" type="button" data-digit="7">7</button>
        <button class="pin-key" type="button" data-digit="8">8</button>
        <button class="pin-key" type="button" data-digit="9">9</button>
        <button class="pin-key empty" type="button" tabindex="-1"></button>
        <button class="pin-key" type="button" data-digit="0">0</button>
        <button class="pin-key action" type="button" data-action="back" aria-label="Apagar">⌫</button>
      </div>
      <div class="pin-actions">
        <button class="pin-reset-btn" type="button" id="pinReset" hidden>Esqueci meu PIN</button>
        <button class="pin-back-btn" type="button" id="pinBack">← Voltar</button>
      </div>
    </div>
  </section>

  <div class="app-shell" id="screen-app" hidden>
    <header class="fit-topbar">
      <button class="avatar-button" id="profileSwitcher" type="button" aria-label="Abrir conta online"><span id="topAvatar">FP</span></button>
      <a class="fit-brand" href="#treino" aria-label="FitPlan — início"><img src="logo-mark.svg" alt=""><span>FitPlan</span></a>
      <button class="top-icon-button" id="settingsButton" type="button" aria-label="Configurações">⚙</button>
    </header>

    <main class="app fit-content">
      <section class="fit-view is-active" id="view-workout" data-view="workout">
        <div class="home-greeting">
          <div>
            <p class="eyebrow" id="todayLabel">TREINO • HOJE</p>
            <h1 id="appTitle">FitPlan</h1>
            <p class="profile-indicator" id="profileIndicator">Perfil: -</p>
            <p class="subtitle" id="appSubtitle">—</p>
          </div>
          <strong class="exercise-count"><span id="heroExerciseCount">0</span><small>EXERCÍCIOS</small></strong>
        </div>

        <div class="hero-progress" aria-hidden="true">
          <span id="progressText">0/0</span>
          <span class="progress-track"><span class="progress-fill" id="progressFill" style="--progress: 0%"></span></span>
        </div>

        <nav class="tabs-shell" id="tabsShell" aria-label="Treinos"></nav>
        <section class="workout" id="workout" aria-live="polite"></section>
      </section>

      <section class="fit-view" id="view-history" data-view="history"></section>
      <section class="fit-view" id="view-progress" data-view="progress"></section>
      <section class="fit-view" id="view-profile" data-view="profile"></section>
    </main>

    <nav class="bottom-nav" aria-label="Navegação principal">
      <button class="bottom-nav-item is-active" type="button" data-route="workout"><span>⚒</span><small>Treino</small></button>
      <button class="bottom-nav-item" type="button" data-route="history"><span>◷</span><small>Histórico</small></button>
      <button class="bottom-nav-item" type="button" data-route="progress"><span>⌁</span><small>Progresso</small></button>
      <button class="bottom-nav-item" type="button" data-route="profile"><span>♙</span><small>Perfil</small></button>
    </nav>

    <aside class="rest-bar" aria-label="Cronômetro de descanso">
      <div class="rest-inner">
        <button class="icon-button hidden" id="stopTimer" type="button" title="Zerar descanso" aria-label="Zerar descanso"><span aria-hidden="true">×</span></button>
        <div class="rest-status"><div class="rest-label">Descanso</div><div class="timer" id="timer">00:00</div></div>
        <div class="rest-actions">
          <button class="rest-button" type="button" data-rest="60">60s</button>
          <button class="rest-button" type="button" data-rest="90">90s</button>
          <button class="rest-button" type="button" data-rest="120">120s</button>
          <button class="rest-button" type="button" data-rest="180">180s</button>
        </div>
      </div>
    </aside>

    <div class="sr-only" aria-hidden="true">
      <button id="resetDay" type="button">Limpar treino</button>
      <button id="todayWorkout" type="button">Treino de hoje</button>
      <button id="compactMode" type="button">Modo compacto</button>
      <button id="exportData" type="button">Exportar dados</button>
      <button id="logoutBtn" type="button">Sair da conta</button>
      <input id="importData" type="file" accept="application/json">
    </div>
  </div>

  <div class="fit-overlay" id="fitOverlay" hidden></div>
  <script src="src/data/exercise-media.js"></script>
  <script src="src/data/exercise-variants.js"></script>
  <script src="src/data/prep-meta.js"></script>
  <script src="src/data/profiles.js"></script>

  <script>
    const ACTIVE_KEY = "gym-app-active-profile";
    const UI_KEY = "gym-app-ui";
    const EXPORT_VERSION = 1;
    const todayKey = getLocalDayKey();
    const LOAD_WARMUP_TIP = "Dica de aquecimento: no primeiro exercício de cada grupo muscular, faça 1 ou 2 séries com 40~50% da carga válida antes das séries principais.";

    /* === Helpers === */
    function getLocalDayKey(date = new Date()) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, "0");
      const d = String(date.getDate()).padStart(2, "0");
      return `${y}-${m}-${d}`;
    }

    function profileStateKey(id) { return `gym-app-profile-${id}-state`; }
    function profilePinKey(id) { return `gym-app-profile-${id}-pin`; }

    function hashPin(pin) {
      let h = 5381;
      for (let i = 0; i < pin.length; i++) {
        h = (((h << 5) + h) ^ pin.charCodeAt(i)) >>> 0;
      }
      return String(h);
    }

    function recoverJonathanFromTestProfile() {
      const stateKey = profileStateKey("jonathan");
      const measurementsKey = "gym-app-profile-jonathan-measurements";
      const displayNameKey = "gym-app-profile-jonathan-display-name";
      const rawState = localStorage.getItem(stateKey);
      if (!rawState) return false;

      try {
        const candidate = JSON.parse(rawState);
        const sessions = Array.isArray(candidate.sessions) ? candidate.sessions : [];
        const squatHistory = candidate.history?.["lower-a-squat"];
        const isFourMonthTest = sessions.length === 80
          && sessions[0]?.date === "2026-05-04"
          && sessions.at(-1)?.date === "2026-08-22"
          && Array.isArray(squatHistory)
          && squatHistory.length === 16
          && squatHistory[0]?.load === 80
          && squatHistory.at(-1)?.load === 102.5
          && String(candidate.weights?.["lower-a-leg-press"]) === "205";

        if (!isFourMonthTest) return false;

        localStorage.removeItem(stateKey);
        localStorage.removeItem(displayNameKey);

        try {
          const measurements = JSON.parse(localStorage.getItem(measurementsKey) || "[]");
          const isTestMeasurements = Array.isArray(measurements)
            && measurements.length === 9
            && measurements[0]?.date === "2026-05-04"
            && measurements[0]?.weight === "99.0"
            && measurements.at(-1)?.date === "2026-08-24"
            && measurements.at(-1)?.weight === "92.0";
          if (isTestMeasurements) localStorage.removeItem(measurementsKey);
        } catch {}

        if (localStorage.getItem(profilePinKey("jonathan")) === hashPin("1234")) {
          localStorage.removeItem(profilePinKey("jonathan"));
        }
        if (localStorage.getItem(ACTIVE_KEY) === "jonathan") {
          localStorage.removeItem(ACTIVE_KEY);
        }
        return true;
      } catch {
        return false;
      }
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, (char) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        "\"": "&quot;",
        "'": "&#39;"
      }[char]));
    }

    function slugify(value) {
      return String(value)
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .toLowerCase()
        .replace(/[^a-z0-9]+/g, "-")
        .replace(/^-|-$/g, "") || "opcao";
    }

    function withVariantMedia(exerciseId, variant) {
      const media = variant.media || AUTO_VARIANT_MEDIA[exerciseId]?.[variant.key] || EXERCISE_MEDIA[exerciseId];
      return media ? { ...variant, media } : variant;
    }

    function orderSharedVariants(exercise, catalogKey, preferredKey) {
      const source = SHARED_MOVEMENT_VARIANTS[catalogKey];
      if (!source?.length) return null;
      const preferred = source.find((variant) => variant.key === preferredKey) || source[0];
      return [preferred, ...source.filter((variant) => variant.key !== preferred.key)].map((variant) => {
        const { perSide, ...cleanVariant } = variant;
        if (!perSide) return cleanVariant;
        const prescribedReps = String(exercise.reps || "");
        return {
          ...cleanVariant,
          reps: /cada lado/i.test(prescribedReps) ? prescribedReps : `${prescribedReps} cada lado`.trim()
        };
      });
    }

    function getSharedExerciseVariants(exercise) {
      const text = slugify(exercise.name);
      if (hasAnyTerm(text, [
        "abdominal", "abdomen", "crunch", "prancha", "dead-bug", "mobilidade",
        "corrida-caminhada-intervalada",
        "rotacao-externa", "external-rotation"
      ])) return null;

      if (hasAnyTerm(text, ["cardio", "bike", "bicicleta", "esteira", "caminhada", "eliptico"])) {
        const preferred = hasAnyTerm(text, ["bike", "bicicleta"]) ? "bike" : text.includes("eliptico") ? "eliptico" : "esteira";
        return orderSharedVariants(exercise, "cardio", preferred);
      }
      if (hasAnyTerm(text, ["encolhimento", "shrug"])) {
        return orderSharedVariants(exercise, "shrug", text.includes("maquina") ? "maquina" : "halteres");
      }
      if (hasAnyTerm(text, ["coice", "kickback", "gluteo-no-cabo"])) {
        return orderSharedVariants(exercise, "hipExtension", "polia");
      }
      if (hasAnyTerm(text, ["crucifixo-inverso", "crucifixo-invertido", "voador-inverso", "reverse-fly", "rear-delt", "face-pull"])) {
        return orderSharedVariants(exercise, "rearShoulder", text.includes("face-pull") ? "face-pull" : "maquina");
      }
      if (hasAnyTerm(text, ["supino-inclinado", "incline-press", "incline-chest"])) {
        const preferred = text.includes("smith") ? "smith" : text.includes("maquina") ? "maquina" : "halteres";
        return orderSharedVariants(exercise, "inclinePress", preferred);
      }
      if (hasAnyTerm(text, ["crucifixo", "crossover", "peck-deck", "fly"])) {
        return orderSharedVariants(exercise, "chestFly", text.includes("crossover") ? "crossover" : "maquina");
      }
      if (hasAnyTerm(text, ["supino", "chest-press"])) {
        return orderSharedVariants(exercise, "flatPress", text.includes("maquina") ? "maquina" : "halteres");
      }
      if (hasAnyTerm(text, ["desenvolvimento", "shoulder-press", "overhead-press"])) {
        return orderSharedVariants(exercise, "shoulderPress", text.includes("maquina") ? "maquina" : "halteres");
      }
      if (hasAnyTerm(text, ["elevacao-lateral", "lateral-raise"])) {
        return orderSharedVariants(exercise, "lateralRaise", hasAnyTerm(text, ["polia", "cabo"]) ? "polia" : "halteres");
      }
      if (hasAnyTerm(text, ["pulldown-na-polia", "pullover", "bracos-estendidos", "straight-arm"])) {
        return orderSharedVariants(exercise, "straightArmPull", text.includes("pullover") ? "maquina" : "polia");
      }
      if (hasAnyTerm(text, ["remada", "row"])) {
        const preferred = hasAnyTerm(text, ["unilateral", "um-braco", "one-arm"])
          ? (text.includes("halter") ? "halter-unilateral" : "maquina-unilateral")
          : hasAnyTerm(text, ["curvada", "barra"]) ? "remada-t"
          : hasAnyTerm(text, ["maquina", "articulada", "peito-apoiado"]) ? "maquina-apoiada"
          : "polia-triangulo";
        return orderSharedVariants(exercise, "horizontalRow", preferred);
      }
      if (hasAnyTerm(text, ["puxada", "lat-pulldown", "barra-fixa", "chin-up", "pull-up"])) {
        const preferred = text.includes("supinada") ? "supinada"
          : hasAnyTerm(text, ["aberta", "larga", "pronada"]) ? "pronada"
          : text.includes("barra-fixa") ? "assistida"
          : "neutra";
        return orderSharedVariants(exercise, "verticalPull", preferred);
      }
      if (hasAnyTerm(text, ["rosca-scott", "scott", "preacher-curl"])) {
        return orderSharedVariants(exercise, "preacherCurl", hasAnyTerm(text, ["unilateral", "halter"]) ? "halter" : "maquina");
      }
      if (hasAnyTerm(text, ["rosca-martelo", "hammer-curl", "barra-h"])) {
        return orderSharedVariants(exercise, "hammerCurl", hasAnyTerm(text, ["corda", "polia", "cabo"]) ? "corda" : "halteres");
      }
      if (hasAnyTerm(text, ["rosca", "biceps", "curl"])) {
        const preferred = hasAnyTerm(text, ["polia", "cabo"]) ? "polia" : text.includes("halter") ? "halteres" : "barra-ez";
        return orderSharedVariants(exercise, "bicepsCurl", preferred);
      }
      if (hasAnyTerm(text, ["triceps-frances", "triceps-testa", "frances", "testa", "overhead-triceps"])) {
        const preferred = text.includes("testa") ? (text.includes("cabo") ? "testa-cabo" : "frances-ez") : "frances-cabo";
        return orderSharedVariants(exercise, "tricepsOverhead", preferred);
      }
      if (hasAnyTerm(text, ["triceps", "pulley"])) {
        const preferred = text.includes("unilateral") ? "unilateral" : text.includes("barra") ? "barra-v" : "corda";
        return orderSharedVariants(exercise, "tricepsPushdown", preferred);
      }
      if (hasAnyTerm(text, ["rdl", "terra-romeno", "romeno", "stiff"])) {
        return orderSharedVariants(exercise, "hipHinge", text.includes("halter") ? "halteres" : "barra");
      }
      if (hasAnyTerm(text, ["bulgaro", "afundo", "passada", "split-squat", "lunge"])) {
        return orderSharedVariants(exercise, "splitSquat", text.includes("smith") ? "smith" : "halteres");
      }
      if (hasAnyTerm(text, ["elevacao-pelvica", "hip-thrust", "glute-bridge", "ponte-de-gluteos"])) {
        const preferred = text.includes("maquina") ? "maquina" : text.includes("smith") ? "smith" : "barra";
        return orderSharedVariants(exercise, "hipThrust", preferred);
      }
      if (hasAnyTerm(text, ["flexora", "leg-curl", "nordic"])) {
        return orderSharedVariants(exercise, "legCurl", hasAnyTerm(text, ["cadeira", "sentada", "seated"]) ? "sentada" : "deitada");
      }
      if (hasAnyTerm(text, ["extensora", "leg-extension"])) {
        return orderSharedVariants(exercise, "legExtension", text.includes("unilateral") ? "unilateral" : "bilateral");
      }
      if (hasAnyTerm(text, ["abdutora", "abducao-de-quadril", "hip-abduction", "abductor"])) {
        return orderSharedVariants(exercise, "hipAbduction", hasAnyTerm(text, ["polia", "cabo"]) ? "polia" : "maquina");
      }
      if (hasAnyTerm(text, ["adutora", "aducao-de-quadril", "hip-adduction", "adductor"])) {
        return orderSharedVariants(exercise, "hipAdduction", hasAnyTerm(text, ["polia", "cabo"]) ? "polia" : "maquina");
      }
      if (hasAnyTerm(text, ["panturrilha", "calf"])) {
        return orderSharedVariants(exercise, "calfRaise", hasAnyTerm(text, ["sentada", "seated"]) ? "sentada" : "em-pe");
      }
      if (hasAnyTerm(text, ["leg-press"])) {
        const preferred = text.includes("horizontal") ? "horizontal" : text.includes("unilateral") ? "unilateral" : "45-graus";
        return orderSharedVariants(exercise, "legPress", preferred);
      }
      if (hasAnyTerm(text, ["sumo"])) {
        return orderSharedVariants(exercise, "sumoSquat", text.includes("smith") ? "smith" : "halter");
      }
      if (hasAnyTerm(text, ["agachamento", "hack", "goblet", "squat"])) {
        const preferred = text.includes("hack") ? "hack" : text.includes("smith") ? "smith" : "goblet";
        return orderSharedVariants(exercise, "squat", preferred);
      }
      return null;
    }

    function getExerciseVariants(exercise) {
      const profileVariants = PROFILE_EXERCISE_VARIANTS[currentProfile]?.[exercise.id];
      if (profileVariants) return profileVariants.map((variant) => withVariantMedia(exercise.id, variant));
      if (EXERCISE_VARIANTS[exercise.id]) return EXERCISE_VARIANTS[exercise.id].map((variant) => withVariantMedia(exercise.id, variant));
      const sharedVariants = getSharedExerciseVariants(exercise);
      if (sharedVariants) return sharedVariants.map((variant) => withVariantMedia(exercise.id, variant));
      if (!/\sou\s/i.test(exercise.name)) return [{ key: "base", label: exercise.name }];
      return exercise.name.split(/\sou\s/i).map((label) => {
        const cleaned = label.trim();
        return { key: slugify(cleaned), label: cleaned };
      }).map((variant) => withVariantMedia(exercise.id, variant));
    }

    function getSelectedVariant(exercise) {
      const variants = getExerciseVariants(exercise);
      const storedKey = state?.variants?.[exercise.id];
      return variants.find((variant) => variant.key === storedKey) || variants[0];
    }

    function exerciseStateKey(exercise, variant) {
      const variants = getExerciseVariants(exercise);
      if (variants.length <= 1 || variant.key === variants[0].key) return exercise.id;
      return `${exercise.id}::${variant.key}`;
    }

    function renderMovementMedia(exercise, variant = getSelectedVariant(exercise)) {
      const media = variant?.media || EXERCISE_MEDIA[exercise.id];
      if (!media) return "";
      const alt = `${variant?.label || exercise.name}: simulação visual do movimento`;
      const src = media.url || `${EXERCISE_MEDIA_BASE}${media.id}.gif`;
      return `<img class="movement-image" src="${src}" alt="${escapeHtml(alt)}" title="${escapeHtml(media.label)}" loading="lazy" decoding="async" onerror="this.closest('.exercise-visual').classList.add('media-error'); this.remove();">`;
    }

    /* === State === */
    let currentProfile = null;
    let activeTab = null;
    let state = null;
    let uiState = loadUiState();
    let timerId = null;
    let timerEndsAt = 0;
    let activeRest = 0;

    let pinScreenMode = "enter";
    let pinScreenProfile = null;
    let pinFirstAttempt = "";
    let pinBuffer = "";
    let pinResetArmed = false;
    let pinResetTimer = null;

    const screenPicker = document.querySelector("#screen-picker");
    const screenPin = document.querySelector("#screen-pin");
    const screenApp = document.querySelector("#screen-app");
    const workoutEl = document.querySelector("#workout");
    const timerEl = document.querySelector("#timer");
    const progressText = document.querySelector("#progressText");
    const progressFill = document.querySelector("#progressFill");
    const stopTimer = document.querySelector("#stopTimer");
    const compactModeButton = document.querySelector("#compactMode");
    const todayWorkoutButton = document.querySelector("#todayWorkout");
    const importDataInput = document.querySelector("#importData");

    function loadProfileState(profileId) {
      const profile = profiles[profileId];
      try {
        const parsed = JSON.parse(localStorage.getItem(profileStateKey(profileId))) || {};
        const activeForToday = getTodayWorkoutKey(profile) || parsed.activeTab || profile.defaultTab;
        if (parsed.day !== todayKey) {
          return {
            day: todayKey,
            activeTab: activeForToday,
            weights: parsed.weights || {},
            done: {},
            history: parsed.history || {},
            sessions: parsed.sessions || [],
            seriesProgress: {},
            variants: parsed.variants || {},
            exerciseRest: parsed.exerciseRest || {},
            exerciseNotes: parsed.exerciseNotes || {},
            expandedMedia: parsed.expandedMedia || {}
          };
        }
        return { day: todayKey, weights: {}, done: {}, history: {}, variants: {}, exerciseRest: {}, exerciseNotes: {}, expandedMedia: {}, activeTab: activeForToday, ...parsed };
      } catch {
        return { day: todayKey, weights: {}, done: {}, history: {}, variants: {}, exerciseRest: {}, exerciseNotes: {}, expandedMedia: {}, activeTab: getTodayWorkoutKey(profile) || profile.defaultTab };
      }
    }

    function loadUiState() {
      try {
        return { compact: false, ...JSON.parse(localStorage.getItem(UI_KEY)) };
      } catch {
        return { compact: false };
      }
    }

    function saveUiState() {
      localStorage.setItem(UI_KEY, JSON.stringify(uiState));
    }

    function getTodayWorkoutKey(profile) {
      const prefixes = ["Dom", "Seg", "Ter", "Qua", "Qui", "Sex", "Sáb"];
      const prefix = prefixes[new Date().getDay()];
      return profile.tabs.find((tab) => tab.label.startsWith(prefix))?.key || null;
    }

    function updateModeControls() {
      screenApp.classList.toggle("compact-mode", !!uiState.compact);
      if (compactModeButton) {
        compactModeButton.textContent = uiState.compact ? "Modo visual" : "Modo compacto";
        compactModeButton.setAttribute("aria-pressed", String(!!uiState.compact));
      }
    }

    function updateTodayButton() {
      const profile = currentProfile ? profiles[currentProfile] : null;
      const todayKeyForProfile = profile ? getTodayWorkoutKey(profile) : null;
      if (!todayWorkoutButton) return;
      todayWorkoutButton.hidden = !profile;
      if (!profile) return;
      if (!todayKeyForProfile) {
        todayWorkoutButton.disabled = true;
        todayWorkoutButton.textContent = "Hoje: descanso";
        todayWorkoutButton.title = "Não há treino cadastrado para hoje neste perfil.";
        return;
      }
      todayWorkoutButton.disabled = todayKeyForProfile === activeTab;
      todayWorkoutButton.title = todayKeyForProfile === activeTab ? "Você já está no treino de hoje." : "Ir para o treino de hoje";
      const todayTab = profile?.tabs.find((tab) => tab.key === todayKeyForProfile);
      todayWorkoutButton.textContent = todayTab ? `Hoje: ${todayTab.label}` : "Treino de hoje";
    }

    function saveProfileState() {
      if (!currentProfile) return;
      state.activeTab = activeTab;
      localStorage.setItem(profileStateKey(currentProfile), JSON.stringify(state));
    }

    function showScreen(name) {
      screenPicker.hidden = name !== "picker";
      screenPin.hidden = name !== "pin";
      screenApp.hidden = name !== "app";
      window.scrollTo(0, 0);
    }

    /* === Profile picker === */
    function renderProfilePicker() {
      const list = document.querySelector("#profileList");
      list.innerHTML = `<div class="auth-gate-loading" role="status">Conectando à sua conta…</div>`;
    }

    /* === PIN screen === */
    function openPinScreen(profileId) {
      pinScreenProfile = profileId;
      pinBuffer = "";
      pinFirstAttempt = "";
      clearPinResetRequest();
      const hasPin = !!localStorage.getItem(profilePinKey(profileId));
      pinScreenMode = hasPin ? "enter" : "setup";
      setPinError("");
      renderPinScreen();
      showScreen("pin");
    }

    function renderPinScreen() {
      const profile = profiles[pinScreenProfile];
      document.querySelector("#pinTitle").textContent = profile.name;
      let subtitle = "Digite seu PIN";
      if (pinScreenMode === "setup") subtitle = "Defina um PIN de 4 dígitos";
      if (pinScreenMode === "confirm") subtitle = "Confirme o PIN";
      document.querySelector("#pinSubtitle").textContent = subtitle;
      document.querySelectorAll("#screen-pin .pin-dot").forEach((dot, i) => {
        dot.classList.toggle("filled", i < pinBuffer.length);
      });
      renderPinResetButton();
    }

    function pinPress(digit) {
      if (pinBuffer.length >= 4) return;
      if (pinResetArmed) setPinError("");
      clearPinResetRequest();
      pinBuffer += digit;
      renderPinScreen();
      if (pinBuffer.length === 4) {
        setTimeout(processPinSubmit, 120);
      }
    }

    function pinBackspace() {
      if (pinResetArmed) setPinError("");
      clearPinResetRequest();
      pinBuffer = pinBuffer.slice(0, -1);
      renderPinScreen();
    }

    function clearPinResetRequest() {
      pinResetArmed = false;
      if (pinResetTimer) {
        clearTimeout(pinResetTimer);
        pinResetTimer = null;
      }
    }

    function renderPinResetButton() {
      const btn = document.querySelector("#pinReset");
      if (!btn) return;
      const canReset = pinScreenProfile
        && pinScreenMode === "enter"
        && !!localStorage.getItem(profilePinKey(pinScreenProfile));
      btn.hidden = !canReset;
      btn.textContent = pinResetArmed ? "Resetar PIN" : "Esqueci meu PIN";
      btn.classList.toggle("is-armed", pinResetArmed);
    }

    function requestPinReset() {
      if (!pinScreenProfile || pinScreenMode !== "enter") return;

      if (!pinResetArmed) {
        pinResetArmed = true;
        pinBuffer = "";
        renderPinScreen();
        setPinError("Toque em Resetar PIN para criar um novo PIN neste aparelho.");
        pinResetTimer = setTimeout(() => {
          pinResetTimer = null;
          pinResetArmed = false;
          if (pinScreenMode === "enter") {
            renderPinScreen();
            setPinError("");
          }
        }, 6000);
        return;
      }

      localStorage.removeItem(profilePinKey(pinScreenProfile));
      if (localStorage.getItem(ACTIVE_KEY) === pinScreenProfile) {
        localStorage.removeItem(ACTIVE_KEY);
      }
      clearPinResetRequest();
      pinBuffer = "";
      pinFirstAttempt = "";
      pinScreenMode = "setup";
      renderPinScreen();
      setPinError("PIN removido. Defina um novo PIN.");
    }

    function setPinError(msg) {
      const el = document.querySelector("#pinError");
      if (el) el.textContent = msg;
    }

    function processPinSubmit() {
      if (pinScreenMode === "enter") {
        const stored = localStorage.getItem(profilePinKey(pinScreenProfile));
        if (hashPin(pinBuffer) === stored) {
          setPinError("");
          enterApp(pinScreenProfile);
        } else {
          pinBuffer = "";
          renderPinScreen();
          setPinError("PIN incorreto. Tente de novo.");
        }
      } else if (pinScreenMode === "setup") {
        pinFirstAttempt = pinBuffer;
        pinBuffer = "";
        pinScreenMode = "confirm";
        setPinError("");
        renderPinScreen();
      } else if (pinScreenMode === "confirm") {
        if (pinBuffer === pinFirstAttempt) {
          localStorage.setItem(profilePinKey(pinScreenProfile), hashPin(pinBuffer));
          setPinError("");
          enterApp(pinScreenProfile);
        } else {
          pinBuffer = "";
          pinFirstAttempt = "";
          pinScreenMode = "setup";
          renderPinScreen();
          setPinError("PINs não combinaram. Crie um novo.");
        }
      }
    }

    /* === Enter / leave app === */
    function enterApp(profileId) {
      currentProfile = profileId;
      localStorage.setItem(ACTIVE_KEY, profileId);
      state = loadProfileState(profileId);
      const profile = profiles[profileId];
      const visibleTabKeys = new Set(profile.tabs.map((tab) => tab.key));
      activeTab = visibleTabKeys.has(state.activeTab) ? state.activeTab : profile.defaultTab;
      renderApp();
      showScreen("app");
    }

    function logout() {
      saveProfileState();
      stopRest();
      currentProfile = null;
      state = null;
      activeTab = null;
      localStorage.removeItem(ACTIVE_KEY);
      renderProfilePicker();
      showScreen("picker");
    }

    /* === Render === */
    function renderApp() {
      const profile = profiles[currentProfile];
      document.querySelector("#appTitle").textContent = profile.title;
      document.querySelector("#profileIndicator").textContent = `Perfil: ${profile.name}`;
      document.querySelector("#appSubtitle").textContent = profile.subtitle;
      updateModeControls();
      updateTodayButton();
      const tabsShell = document.querySelector("#tabsShell");
      tabsShell.innerHTML = "";
      const todayWorkoutKey = getTodayWorkoutKey(profile);
      profile.tabs.forEach((tab) => {
        const btn = document.createElement("button");
        btn.className = `tab${tab.key === todayWorkoutKey ? " is-today" : ""}`;
        btn.type = "button";
        btn.dataset.tab = tab.key;
        btn.style.setProperty("--tab-color", tab.color);
        btn.setAttribute("aria-selected", String(tab.key === activeTab));
        btn.innerHTML = `<span class="tab-dot" aria-hidden="true"></span><span class="tab-label">${tab.label}</span>`;
        btn.addEventListener("click", () => {
          activeTab = tab.key;
          saveProfileState();
          renderWorkout();
        });
        tabsShell.appendChild(btn);
      });
      renderWorkout();
    }

    function renderTabs() {
      document.querySelectorAll("#tabsShell .tab").forEach((tab) => {
        tab.setAttribute("aria-selected", String(tab.dataset.tab === activeTab));
      });
      updateTodayButton();
      const activeButton = document.querySelector("#tabsShell .tab[aria-selected='true']");
      if (activeButton) {
        activeButton.scrollIntoView({ behavior: "smooth", block: "nearest", inline: "nearest" });
      }
    }

    function parseLoad(value) {
      const normalized = String(value || "").replace(",", ".").match(/\d+(?:\.\d+)?/);
      return normalized ? Number(normalized[0]) : null;
    }

    function formatLoad(value) {
      if (!Number.isFinite(value)) return "";
      return Number.isInteger(value) ? String(value) : String(Number(value.toFixed(1))).replace(".", ",");
    }

    function getHistoryEntries(key) {
      return state?.history?.[key] || [];
    }

    function getHistorySummary(key) {
      const entries = getHistoryEntries(key).filter((entry) => Number.isFinite(entry.load));
      if (!entries.length) return "";
      const last = entries[entries.length - 1];
      const best = entries.reduce((max, entry) => Math.max(max, entry.load), 0);
      return `Última: ${formatLoad(last.load)} kg • Melhor: ${formatLoad(best)} kg`;
    }

    function hasAnyTerm(text, terms) {
      return terms.some((term) => text.includes(term));
    }

    function selectedExerciseName(exercise) {
      const variants = getExerciseVariants(exercise);
      const selected = getSelectedVariant(exercise);
      if (!selected || variants.length <= 1 || selected.key === variants[0].key) return selected?.displayName || selected?.label || exercise.name;
      if (selected.displayName) return selected.displayName;
      const movementRoot = exercise.name
        .split(/\sou\s/i)[0]
        .trim()
        .split(/\s+/)
        .slice(0, 2)
        .join(" ");
      return `${movementRoot} ${selected.label}`;
    }

    function inferWarmupGroup(exercise) {
      const text = slugify(selectedExerciseName(exercise));
      if (hasAnyTerm(text, ["panturrilha", "calf", "soleo", "gastrocnemio"])) return "panturrilha";
      if (hasAnyTerm(text, ["abdominal", "abdomen", "core", "prancha", "dead-bug", "bird-dog"])) return "abdômen";
      if (hasAnyTerm(text, ["biceps", "rosca", "martelo", "scott", "curl"])) return "bíceps";
      if (hasAnyTerm(text, ["triceps", "pulley", "testa", "frances"])) return "tríceps";
      if (hasAnyTerm(text, ["desenvolvimento", "ombro", "deltoide", "elevacao-lateral", "face-pull", "voador-inverso", "crucifixo-invertido"])) return "ombros";
      if (hasAnyTerm(text, ["supino", "crossover", "crucifixo", "chest-press", "peck-deck", "paralelas"])) return "peito";
      if (hasAnyTerm(text, ["remada", "puxada", "pulldown", "costas", "dorsais", "dorsal"])) return "costas";
      if (hasAnyTerm(text, ["flexora", "posterior", "terra-romeno", "romeno", "stiff"])) return "posterior";
      if (hasAnyTerm(text, ["elevacao-pelvica", "gluteo", "gluteos", "abdutora", "abdutora", "abductor", "coice", "bulgaro", "afundo"])) return "glúteos";
      if (hasAnyTerm(text, ["agachamento", "hack", "leg-press", "extensora", "quadriceps", "smith"])) return "quadríceps";
      return "geral";
    }

    function inferPrepGroupFromName(name) {
      const text = slugify(name);

      // Condicionamento e mobilidade não possuem um único músculo-alvo.
      if (hasAnyTerm(text, ["corrida", "caminhada", "esteira", "eliptico", "cardio-zona-2"])) {
        return "Quadríceps femoral • glúteo máximo • isquiotibiais • tríceps sural";
      }
      if (hasAnyTerm(text, ["bike", "bicicleta"])) {
        return "Quadríceps femoral • glúteo máximo • tríceps sural";
      }
      if (hasAnyTerm(text, ["mobilidade"])) {
        return "Sem alvo único • musculatura do quadril e do tronco";
      }

      // Tronco.
      if (hasAnyTerm(text, ["prancha-lateral"])) {
        return "Oblíquos • quadrado lombar • glúteo médio";
      }
      if (hasAnyTerm(text, ["prancha", "dead-bug", "bird-dog"])) {
        return "Reto abdominal • transverso do abdome • oblíquos";
      }
      if (hasAnyTerm(text, ["abdominal-infra", "elevacao-de-pernas", "elevacao-de-joelhos", "leg-raise"])) {
        return "Reto abdominal • iliopsoas";
      }
      if (hasAnyTerm(text, ["abdominal", "abdomen", "crunch"])) {
        return "Reto abdominal • oblíquos";
      }

      // Quadril, coxa e perna.
      if (hasAnyTerm(text, ["panturrilha-sentada", "seated-calf"])) {
        return "Sóleo";
      }
      if (hasAnyTerm(text, ["panturrilha", "calf"])) {
        return "Gastrocnêmio medial e lateral • sóleo";
      }
      if (hasAnyTerm(text, ["adutora", "aducao-de-quadril", "hip-adduction"])) {
        return "Adutores do quadril: longo, magno, curto e grácil";
      }
      if (hasAnyTerm(text, ["abdutora", "abducao-de-quadril", "hip-abduction", "abductor"])) {
        return "Glúteo médio • glúteo mínimo";
      }
      if (hasAnyTerm(text, ["elevacao-pelvica", "hip-thrust", "glute-bridge", "ponte-de-gluteos", "coice", "kickback", "gluteo-no-cabo"])) {
        return "Glúteo máximo";
      }
      if (hasAnyTerm(text, ["rdl", "terra-romeno", "romeno", "stiff"])) {
        return "Isquiotibiais: bíceps femoral, semitendíneo e semimembranáceo • glúteo máximo";
      }
      if (hasAnyTerm(text, ["flexora", "leg-curl", "nordic"])) {
        return "Isquiotibiais: bíceps femoral, semitendíneo e semimembranáceo";
      }
      if (hasAnyTerm(text, ["extensora", "leg-extension"])) {
        return "Quadríceps femoral: reto femoral e vastos";
      }
      if (hasAnyTerm(text, ["bulgaro", "afundo", "passada", "split-squat", "lunge"])) {
        return "Quadríceps femoral • glúteo máximo • glúteo médio";
      }
      if (hasAnyTerm(text, ["sumo"])) {
        return "Quadríceps femoral • glúteo máximo • adutores do quadril";
      }
      if (hasAnyTerm(text, ["leg-press-com-pes-mais-altos", "leg-press-pes-mais-altos", "leg-press-45-pes-medios-altos"])) {
        return "Glúteo máximo • quadríceps femoral • isquiotibiais";
      }
      if (hasAnyTerm(text, ["leg-press"])) {
        return "Quadríceps femoral • glúteo máximo";
      }
      if (hasAnyTerm(text, ["agachamento", "hack", "goblet", "squat"])) {
        return "Quadríceps femoral • glúteo máximo • adutor magno";
      }

      // Cintura escapular, ombro e peito.
      if (hasAnyTerm(text, ["rotacao-externa", "external-rotation"])) {
        return "Infraespinhal • redondo menor";
      }
      if (hasAnyTerm(text, ["face-pull"])) {
        return "Deltoide posterior • infraespinhal • redondo menor • trapézio médio • romboides";
      }
      if (hasAnyTerm(text, ["crucifixo-inverso", "crucifixo-invertido", "voador-inverso", "reverse-fly", "rear-delt"])) {
        return "Deltoide posterior • trapézio médio • romboides";
      }
      if (hasAnyTerm(text, ["encolhimento", "shrug"])) {
        return "Trapézio superior • elevador da escápula";
      }
      if (hasAnyTerm(text, ["elevacao-lateral", "lateral-raise"])) {
        return "Deltoide lateral • supraespinhal";
      }
      if (hasAnyTerm(text, ["desenvolvimento", "shoulder-press", "overhead-press"])) {
        return "Deltoide anterior e lateral • tríceps braquial";
      }
      if (hasAnyTerm(text, ["supino-inclinado", "incline-chest", "incline-press"])) {
        return "Peitoral maior (porção clavicular) • deltoide anterior";
      }
      if (hasAnyTerm(text, ["crossover-de-cima-para-baixo", "declinado", "decline-press"])) {
        return "Peitoral maior (porção esternocostal)";
      }
      if (hasAnyTerm(text, ["crucifixo", "crossover", "peck-deck", "fly"])) {
        return "Peitoral maior (porções esternocostal e clavicular)";
      }
      if (hasAnyTerm(text, ["supino", "chest-press"])) {
        return "Peitoral maior (porções esternocostal e clavicular) • tríceps braquial";
      }

      // Costas e flexores/extensores do cotovelo.
      if (hasAnyTerm(text, ["pulldown-na-polia", "pullover", "bracos-estendidos", "straight-arm"])) {
        return "Latíssimo do dorso (grande dorsal) • redondo maior";
      }
      if (hasAnyTerm(text, ["puxada", "barra-fixa", "lat-pulldown", "chin-up", "pull-up"])) {
        return "Latíssimo do dorso (grande dorsal) • redondo maior • bíceps braquial";
      }
      if (hasAnyTerm(text, ["remada", "row"])) {
        return "Latíssimo do dorso (grande dorsal) • trapézio médio/inferior • romboides • deltoide posterior";
      }
      if (hasAnyTerm(text, ["rosca-martelo", "hammer-curl", "barra-h"])) {
        return "Braquial • braquiorradial • bíceps braquial";
      }
      if (hasAnyTerm(text, ["rosca", "biceps", "curl", "scott"])) {
        return "Bíceps braquial • braquial";
      }
      if (hasAnyTerm(text, ["triceps-frances", "triceps-testa", "frances", "testa", "overhead-triceps"])) {
        return "Tríceps braquial (ênfase na cabeça longa)";
      }
      if (hasAnyTerm(text, ["triceps", "pulley"])) {
        return "Tríceps braquial (cabeças lateral, medial e longa)";
      }

      return "Corpo inteiro • sem músculo-alvo isolado";
    }

    window.FitPlanMuscles = Object.freeze({ targetForName: inferPrepGroupFromName });

    function inferPrepGroup(exercise) {
      return inferPrepGroupFromName(selectedExerciseName(exercise));
    }

    function inferPrepKind(exercise) {
      const text = slugify(`${exercise.name} ${exercise.note || ""}`);
      if (hasAnyTerm(text, [
        "extensora", "flexora", "abdutora", "abdutora", "coice", "panturrilha", "calf",
        "rosca", "triceps", "pulley", "elevacao-lateral", "face-pull", "voador",
        "crucifixo", "crossover", "abdominal", "prancha"
      ])) return "isolation";
      if (hasAnyTerm(text, [
        "agachamento", "hack", "leg-press", "terra-romeno", "romeno", "stiff",
        "supino", "chest-press", "remada-curvada", "remada-maquina", "remada-unilateral",
        "remada-articulada", "elevacao-pelvica"
      ])) return "heavy";
      return "moderate";
    }

    function inferPrepMeta(exercise) {
      return {
        group: inferPrepGroup(exercise),
        warmupGroup: inferWarmupGroup(exercise),
        kind: inferPrepKind(exercise)
      };
    }

    function getPrepMeta(exercise) {
      const inferred = inferPrepMeta(exercise);
      const stored = PREP_EXERCISE_META[currentProfile]?.[exercise.id];
      return {
        ...inferred,
        ...(stored || {}),
        group: inferred.group,
        warmupGroup: stored?.group || inferred.warmupGroup
      };
    }

    function getActiveWorkoutExercises() {
      return profiles[currentProfile]?.workouts?.[activeTab]?.exercises || [];
    }

    function isFirstPrepForGroup(exercise, workoutExercises = getActiveWorkoutExercises()) {
      const meta = getPrepMeta(exercise);
      if (!meta) return false;
      const exerciseIndex = workoutExercises.findIndex((item) => item.id === exercise.id);
      const previousExercises = workoutExercises.slice(0, Math.max(0, exerciseIndex));
      return !previousExercises.some((item) => getPrepMeta(item)?.warmupGroup === meta.warmupGroup);
    }

    function roundPrepLoad(value) {
      return Math.round(value * 2) / 2;
    }

    function buildPrepSets(load, kind, isFirstForGroup) {
      if (!isFirstForGroup) {
        if (kind === "isolation") return [];
        return [{ percent: 50, reps: "5 reps" }];
      }

      if (kind === "heavy") {
        if (load >= 80) {
          return [
            { percent: 40, reps: "8 reps" },
            { percent: 60, reps: "5 reps" },
            { percent: 75, reps: "3 reps" },
            { percent: 85, reps: "1–2 reps" }
          ];
        }
        if (load >= 40) {
          return [
            { percent: 50, reps: "8 reps" },
            { percent: 70, reps: "4–5 reps" }
          ];
        }
        return [{ percent: 50, reps: "8–10 reps" }];
      }

      if (kind === "moderate") {
        if (load >= 60) {
          return [
            { percent: 50, reps: "8 reps" },
            { percent: 70, reps: "4 reps" }
          ];
        }
        return [{ percent: 50, reps: "8 reps" }];
      }

      return [{ percent: 50, reps: "10–12 reps" }];
    }

    function renderPreparatoryPanel(exercise, stateKey, workoutExercises = getActiveWorkoutExercises()) {
      if (exercise.trackWeight === false) return "";
      const meta = getPrepMeta(exercise);
      if (!meta) return "";

      const load = parseLoad(state.weights[stateKey]);
      if (!Number.isFinite(load)) {
        return `
          <details class="prep-panel">
            <summary><span>Preparatórias</span><span class="prep-summary-value">carga pendente</span></summary>
            <p class="prep-empty">Informe a carga válida para calcular as séries de aproximação.</p>
          </details>
        `;
      }

      const isFirstForGroup = isFirstPrepForGroup(exercise, workoutExercises);
      const prepSets = buildPrepSets(load, meta.kind, isFirstForGroup)
        .map((set) => ({ ...set, load: roundPrepLoad(load * (set.percent / 100)) }));
      const summary = prepSets.length ? `${prepSets.length} séries` : "opcional";
      const note = isFirstForGroup
        ? `${meta.group}: aquecimento específico antes das séries válidas.`
        : `${meta.group} já aquecido neste treino; use só se precisar sentir o movimento.`;

      return `
        <details class="prep-panel">
          <summary><span>Preparatórias</span><span class="prep-summary-value">${escapeHtml(summary)}</span></summary>
          <p class="prep-note">${escapeHtml(note)} Não contam como séries de trabalho.</p>
          ${prepSets.length ? `
            <div class="prep-list">
              ${prepSets.map((set) => `
                <div class="prep-row">
                  <span>${set.percent}%</span>
                  <strong>${formatLoad(set.load)} kg</strong>
                  <span>${escapeHtml(set.reps)}</span>
                </div>
              `).join("")}
            </div>
          ` : ""}
        </details>
      `;
    }

    function updatePreparatoryPanel(article, exercise, stateKey) {
      const currentPanel = article.querySelector(".prep-panel");
      const wasOpen = !!currentPanel?.open;
      const nextHtml = renderPreparatoryPanel(exercise, stateKey);
      if (!nextHtml) {
        currentPanel?.remove();
        return;
      }
      const template = document.createElement("template");
      template.innerHTML = nextHtml.trim();
      const nextPanel = template.content.firstElementChild;
      if (nextPanel && wasOpen) nextPanel.open = true;
      if (currentPanel) {
        currentPanel.replaceWith(nextPanel);
        return;
      }
      const historyLine = article.querySelector(".history-line");
      if (historyLine) historyLine.after(nextPanel);
      else article.querySelector(".weight-row")?.after(nextPanel);
    }

    function recordExerciseHistory(exercise, variant, weightValue) {
      const load = parseLoad(weightValue);
      if (!Number.isFinite(load)) return;
      const key = exerciseStateKey(exercise, variant);
      state.history = state.history || {};
      const entries = state.history[key] || [];
      const entry = {
        date: todayKey,
        tab: activeTab,
        exerciseId: exercise.id,
        variant: variant.key,
        load
      };
      const todayIndex = entries.findIndex((item) => item.date === todayKey && item.tab === activeTab);
      if (todayIndex >= 0) entries[todayIndex] = entry;
      else entries.push(entry);
      state.history[key] = entries.slice(-16);
    }

    function renderVariantControls(exercise, variants, selectedVariant) {
      if (variants.length <= 1) return "";
      return `
        <div class="variant-control" role="group" aria-label="Variação do exercício">
          ${variants.map((variant) => `
            <button class="variant-button" type="button" data-variant="${escapeHtml(variant.key)}" aria-pressed="${variant.key === selectedVariant.key}">
              ${escapeHtml(variant.label)}
            </button>
          `).join("")}
        </div>
      `;
    }

    function getExerciseDoneSummary(exercise, stateKey) {
      return [
        exercise.sets ? `${exercise.sets} séries` : "",
        exercise.reps ? `${exercise.reps} reps` : "",
        state.weights[stateKey] ? `${state.weights[stateKey]} kg` : ""
      ].filter(Boolean).join(" • ") || "Concluído";
    }

    function updateExerciseCardForVariant(article, exercise) {
      const variants = getExerciseVariants(exercise);
      const selectedVariant = getSelectedVariant(exercise);
      const stateKey = exerciseStateKey(exercise, selectedVariant);
      const displayName = variants.length > 1 ? (selectedVariant.displayName || selectedVariant.label) : exercise.name;
      const isDone = !!state.done[stateKey];
      const doneExpanded = !!state.expandedDone?.[stateKey];
      const historySummary = getHistorySummary(stateKey);

      article.dataset.stateKey = stateKey;
      article.classList.toggle("done", isDone);
      article.classList.toggle("expanded-done", doneExpanded);
      article.title = isDone ? "Toque no card para ver detalhes. Toque no check para desmarcar." : "";
      article.querySelector(".exercise-title").textContent = displayName;
      article.querySelector(".done-summary").textContent = getExerciseDoneSummary(exercise, stateKey);
      article.querySelectorAll(".variant-button").forEach((button) => {
        button.setAttribute("aria-pressed", String(button.dataset.variant === selectedVariant.key));
      });

      const visual = article.querySelector(".exercise-visual");
      if (visual) {
        visual.classList.remove("media-error");
        visual.innerHTML = renderMovementMedia(exercise, selectedVariant);
      }

      const weightInput = article.querySelector(".weight-input");
      const weightLabel = article.querySelector(".weight-label");
      if (weightInput) {
        weightInput.id = `weight-${stateKey}`;
        weightInput.value = state.weights[stateKey] || "";
      }
      if (weightLabel) {
        weightLabel.setAttribute("for", `weight-${stateKey}`);
      }

      let historyLine = article.querySelector(".history-line");
      if (historySummary && weightInput) {
        if (!historyLine) {
          historyLine = document.createElement("p");
          historyLine.className = "history-line";
          article.querySelector(".weight-row")?.after(historyLine);
        }
        historyLine.textContent = historySummary;
      } else if (historyLine) {
        historyLine.remove();
      }
      updatePreparatoryPanel(article, exercise, stateKey);

      const doneButton = article.querySelector(".done-button");
      if (doneButton) {
        doneButton.title = isDone ? "Desmarcar exercício" : "Concluir exercício";
        doneButton.setAttribute("aria-label", `${isDone ? "Desmarcar" : "Concluir"} ${displayName}`);
      }
    }

    function renderWorkout() {
      const profile = profiles[currentProfile];
      const workout = profile.workouts[activeTab];
      renderTabs();
      workoutEl.innerHTML = "";

      const summary = document.createElement("div");
      summary.className = "day-summary";
      summary.innerHTML = `
        <p class="day-kicker">${workout.total}</p>
        <h2>${workout.title}</h2>
        <details class="warmup-panel">
          <summary>Aquecimento</summary>
          ${workout.warmup ? `<p>${workout.warmup}</p>` : ""}
          <p>${LOAD_WARMUP_TIP}</p>
        </details>
      `;
      workoutEl.appendChild(summary);

      workout.exercises.forEach((exercise) => {
        const variants = getExerciseVariants(exercise);
        const selectedVariant = getSelectedVariant(exercise);
        const stateKey = exerciseStateKey(exercise, selectedVariant);
        const isDone = !!state.done[stateKey];
        const displayName = variants.length > 1 ? (selectedVariant.displayName || selectedVariant.label) : exercise.name;
        const historySummary = getHistorySummary(stateKey);
        const mediaExpanded = !!state.expandedMedia?.[exercise.id];
        const doneExpanded = !!state.expandedDone?.[stateKey];
        const doneSummary = getExerciseDoneSummary(exercise, stateKey);
        const controlsHtml = variants.length > 1 || uiState.compact ? `
          <div class="exercise-controls">
            ${renderVariantControls(exercise, variants, selectedVariant)}
            <button class="media-toggle" type="button">${mediaExpanded ? "Ocultar movimento" : "Ver movimento"}</button>
          </div>
        ` : "";
        const article = document.createElement("article");
        article.className = `exercise${isDone ? " done" : ""}${doneExpanded ? " expanded-done" : ""}${mediaExpanded ? " show-media" : ""}`;
        article.dataset.id = exercise.id;
        article.dataset.stateKey = stateKey;
        article.title = isDone ? "Toque no card para ver detalhes. Toque no check para desmarcar." : "";
        article.innerHTML = `
          <div class="exercise-main">
            <h2 class="exercise-title">${escapeHtml(displayName)}</h2>
            <p class="done-summary">${escapeHtml(doneSummary || "Concluído")}</p>
            <p class="exercise-note">${exercise.note}</p>
            ${controlsHtml}
            <div class="metrics">
              <div>
                <span class="metric-label">Séries</span>
                <div class="metric-value">${exercise.sets}</div>
              </div>
              <div>
                <span class="metric-label">Reps</span>
                <div class="metric-value">${exercise.reps}</div>
              </div>
              <div>
                <span class="metric-label">RIR</span>
                <div class="metric-value">${exercise.rir}</div>
              </div>
              <div>
                <span class="metric-label">Descanso</span>
                <div class="metric-value">${exercise.restLabel}</div>
              </div>
            </div>
            ${exercise.trackWeight === false ? "" : `
              <div class="weight-row">
                <label class="weight-label" for="weight-${stateKey}">Carga (kg)</label>
                <input class="weight-input" id="weight-${stateKey}" inputmode="decimal" autocomplete="off" value="${state.weights[stateKey] || ""}">
              </div>
              ${historySummary ? `<p class="history-line">${historySummary}</p>` : ""}
              ${renderPreparatoryPanel(exercise, stateKey, workout.exercises)}
            `}
          </div>
          <figure class="exercise-visual">
            ${renderMovementMedia(exercise, selectedVariant)}
          </figure>
          <button class="done-button" type="button" title="${isDone ? "Desmarcar exercício" : "Concluir exercício"}" aria-label="${isDone ? "Desmarcar" : "Concluir"} ${displayName}">
            <span class="check-ring" aria-hidden="true"></span>
          </button>
        `;
        article.addEventListener("click", (event) => {
          const currentKey = article.dataset.stateKey || stateKey;
          if (!state.done[currentKey]) return;
          if (event.target.closest("button,input,label,a,summary,details")) return;
          const scrollXBefore = window.scrollX;
          const scrollYBefore = window.scrollY;
          state.expandedDone = state.expandedDone || {};
          state.expandedDone[currentKey] = !state.expandedDone[currentKey];
          article.classList.toggle("expanded-done", state.expandedDone[currentKey]);
          saveProfileState();
          requestAnimationFrame(() => {
            window.scrollTo(scrollXBefore, scrollYBefore);
            setTimeout(() => window.scrollTo(scrollXBefore, scrollYBefore), 0);
            setTimeout(() => window.scrollTo(scrollXBefore, scrollYBefore), 120);
          });
        });
        article.querySelectorAll(".variant-button").forEach((button) => {
          button.addEventListener("click", () => {
            const scrollXBefore = window.scrollX;
            const scrollYBefore = window.scrollY;
            state.variants = state.variants || {};
            state.variants[exercise.id] = button.dataset.variant;
            saveProfileState();
            updateExerciseCardForVariant(article, exercise);
            updateProgress();
            requestAnimationFrame(() => {
              window.scrollTo(scrollXBefore, scrollYBefore);
              setTimeout(() => window.scrollTo(scrollXBefore, scrollYBefore), 0);
              setTimeout(() => window.scrollTo(scrollXBefore, scrollYBefore), 120);
            });
          });
        });
        article.querySelector(".media-toggle")?.addEventListener("click", () => {
          const scrollXBefore = window.scrollX;
          const scrollYBefore = window.scrollY;
          state.expandedMedia = state.expandedMedia || {};
          state.expandedMedia[exercise.id] = !state.expandedMedia[exercise.id];
          saveProfileState();
          renderWorkout();
          requestAnimationFrame(() => {
            window.scrollTo(scrollXBefore, scrollYBefore);
            setTimeout(() => window.scrollTo(scrollXBefore, scrollYBefore), 0);
            setTimeout(() => window.scrollTo(scrollXBefore, scrollYBefore), 120);
          });
        });
        const weightInput = article.querySelector(".weight-input");
        if (weightInput) {
          weightInput.addEventListener("input", (event) => {
            const currentKey = article.dataset.stateKey || stateKey;
            state.weights[currentKey] = event.target.value.trim();
            const doneSummaryEl = article.querySelector(".done-summary");
            if (doneSummaryEl) doneSummaryEl.textContent = getExerciseDoneSummary(exercise, currentKey);
            updatePreparatoryPanel(article, exercise, currentKey);
            saveProfileState();
          });
        }
        const doneButton = article.querySelector(".done-button");
        doneButton.addEventListener("click", (event) => {
          event.stopPropagation();
          const scrollXBefore = window.scrollX;
          const scrollYBefore = window.scrollY;
          const keepScrollPosition = () => requestAnimationFrame(() => {
            window.scrollTo(scrollXBefore, scrollYBefore);
            setTimeout(() => window.scrollTo(scrollXBefore, scrollYBefore), 0);
            setTimeout(() => window.scrollTo(scrollXBefore, scrollYBefore), 120);
          });
          const currentKey = article.dataset.stateKey || stateKey;
          const wasDone = !!state.done[currentKey];
          if (wasDone) {
            delete state.done[currentKey];
            if (state.expandedDone) delete state.expandedDone[currentKey];
            article.classList.remove("done", "expanded-done");
            article.title = "";
            doneButton.title = "Concluir exercício";
            doneButton.setAttribute("aria-label", `Concluir ${displayName}`);
            saveProfileState();
            updateProgress();
            keepScrollPosition();
            return;
          }

          state.done[currentKey] = true;
          if (state.expandedDone) delete state.expandedDone[currentKey];
          article.classList.add("done");
          article.classList.remove("expanded-done");
          article.title = "Toque no card para ver detalhes. Toque no check para desmarcar.";
          doneButton.title = "Desmarcar exercício";
          doneButton.setAttribute("aria-label", `Desmarcar ${displayName}`);
          const doneSummaryEl = article.querySelector(".done-summary");
          if (doneSummaryEl) {
            doneSummaryEl.textContent = getExerciseDoneSummary(exercise, currentKey);
          }
          recordExerciseHistory(exercise, getSelectedVariant(exercise), weightInput?.value);
          const nextHistorySummary = getHistorySummary(currentKey);
          if (nextHistorySummary && weightInput) {
            let historyLine = article.querySelector(".history-line");
            if (!historyLine) {
              historyLine = document.createElement("p");
              historyLine.className = "history-line";
              article.querySelector(".weight-row")?.after(historyLine);
            }
            historyLine.textContent = nextHistorySummary;
          }
          if (exercise.restSeconds > 0) startRest(exercise.restSeconds);
          saveProfileState();
          updateProgress();
          keepScrollPosition();
        });
        workoutEl.appendChild(article);
      });
      updateProgress();
    }

    function updateProgress() {
      const profile = profiles[currentProfile];
      const exercises = profile.workouts[activeTab].exercises;
      const done = exercises.filter((exercise) => state.done[exerciseStateKey(exercise, getSelectedVariant(exercise))]).length;
      const total = exercises.length;
      progressText.textContent = `${done}/${total}`;
      progressFill.style.setProperty("--progress", `${total ? (done / total) * 100 : 0}%`);
    }

    /* === Timer === */
    function formatTime(totalSeconds) {
      const seconds = Math.max(0, Math.ceil(totalSeconds));
      const minutes = Math.floor(seconds / 60);
      const restSeconds = seconds % 60;
      return `${String(minutes).padStart(2, "0")}:${String(restSeconds).padStart(2, "0")}`;
    }

    function startRest(seconds) {
      activeRest = seconds;
      timerEndsAt = Date.now() + seconds * 1000;
      document.querySelector(".rest-bar")?.classList.remove("is-complete");
      document.querySelectorAll(".rest-button").forEach((b) => {
        b.classList.toggle("active", Number(b.dataset.rest) === seconds);
      });
      stopTimer.classList.remove("hidden");
      tickTimer();
      clearInterval(timerId);
      timerId = setInterval(tickTimer, 250);
    }

    function stopRest() {
      clearInterval(timerId);
      timerId = null;
      timerEndsAt = 0;
      activeRest = 0;
      if (timerEl) {
        timerEl.textContent = "00:00";
        timerEl.classList.remove("running");
      }
      document.querySelector(".rest-bar")?.classList.remove("is-complete");
      if (stopTimer) stopTimer.classList.add("hidden");
      document.querySelectorAll(".rest-button").forEach((b) => b.classList.remove("active"));
    }

    function signalRestComplete() {
      document.querySelector(".rest-bar")?.classList.add("is-complete");
      if ("vibrate" in navigator) navigator.vibrate([180, 80, 180]);
    }

    function tickTimer() {
      const remaining = (timerEndsAt - Date.now()) / 1000;
      timerEl.textContent = formatTime(remaining);
      timerEl.classList.toggle("running", remaining > 0);
      if (remaining <= 0) {
        clearInterval(timerId);
        timerId = null;
        if (activeRest) {
          signalRestComplete();
          timerEl.textContent = "Fim";
          stopTimer.classList.add("hidden");
          document.querySelectorAll(".rest-button").forEach((b) => b.classList.remove("active"));
          activeRest = 0;
        }
      }
    }

    /* === Data portability === */
    function collectStoredData() {
      const values = {};
      for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        if (key?.startsWith("gym-app-")) values[key] = localStorage.getItem(key);
      }
      return {
        app: "FitPlan",
        version: EXPORT_VERSION,
        exportedAt: new Date().toISOString(),
        values
      };
    }

    function exportData() {
      const payload = collectStoredData();
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = `fitplan-backup-${todayKey}.json`;
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(link.href);
    }

    function importData(file) {
      if (!file) return;
      const reader = new FileReader();
      reader.addEventListener("load", () => {
        try {
          const payload = JSON.parse(String(reader.result || "{}"));
          if (!payload.values || typeof payload.values !== "object") {
            throw new Error("Formato inválido");
          }
          const ok = window.confirm("Importar este backup vai substituir os dados locais do FitPlan neste aparelho. Continuar?");
          if (!ok) return;
          Object.entries(payload.values).forEach(([key, value]) => {
            if (key.startsWith("gym-app-")) localStorage.setItem(key, String(value));
          });
          window.location.reload();
        } catch {
          window.alert("Não foi possível importar o arquivo. Verifique se ele é um backup válido do FitPlan.");
        }
      });
      reader.readAsText(file);
    }

    /* === Wiring === */
    document.querySelectorAll(".rest-button").forEach((b) => {
      b.addEventListener("click", () => startRest(Number(b.dataset.rest)));
    });

    stopTimer.addEventListener("click", stopRest);

    compactModeButton.addEventListener("click", () => {
      uiState.compact = !uiState.compact;
      saveUiState();
      updateModeControls();
      renderWorkout();
    });

    todayWorkoutButton.addEventListener("click", () => {
      const todayWorkout = getTodayWorkoutKey(profiles[currentProfile]);
      if (!todayWorkout) return;
      activeTab = todayWorkout;
      saveProfileState();
      renderWorkout();
    });

    document.querySelector("#exportData").addEventListener("click", exportData);
    importDataInput.addEventListener("change", (event) => {
      importData(event.target.files?.[0]);
      importDataInput.value = "";
    });

    document.querySelector("#resetDay").addEventListener("click", () => {
      if (!state) return;
      state.done = {};
      state.seriesProgress = {};
      state.day = todayKey;
      stopRest();
      saveProfileState();
      renderWorkout();
    });

    document.querySelector("#logoutBtn").addEventListener("click", logout);

    document.querySelectorAll("#screen-pin .pin-key").forEach((btn) => {
      btn.addEventListener("click", () => {
        if (btn.dataset.action === "back") pinBackspace();
        else if (btn.dataset.digit) pinPress(btn.dataset.digit);
      });
    });

    document.querySelector("#pinBack").addEventListener("click", () => {
      pinBuffer = "";
      pinFirstAttempt = "";
      clearPinResetRequest();
      setPinError("");
      showScreen("picker");
    });

    document.querySelector("#pinReset").addEventListener("click", requestPinReset);

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js").catch(() => {});
      });
    }

    /* === Init === */
    (function init() {
      recoverJonathanFromTestProfile();
      renderProfilePicker();
      showScreen("picker");
    })();
  </script>

</body>

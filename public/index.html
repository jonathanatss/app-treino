<!doctype html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101010">
  <meta name="description" content="Treinos personalizados com perfis, séries, descanso, cargas e imagens dos movimentos.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="FitPlan">
  <meta property="og:description" content="Acompanhe treinos personalizados por perfil, com séries, repetições, descanso, cargas e imagens dos exercícios.">
  <meta property="og:image" content="https://app-treino-jonathan.netlify.app/icon-512-v2.png">
  <meta property="og:url" content="https://app-treino-jonathan.netlify.app/">
  <meta property="og:site_name" content="FitPlan">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="FitPlan">
  <meta name="twitter:description" content="Treinos personalizados por perfil, com séries, descanso, cargas e imagens dos exercícios.">
  <meta name="twitter:image" content="https://app-treino-jonathan.netlify.app/icon-512-v2.png">
  <title>FitPlan</title>

  <!-- PWA / iOS Add to Home Screen -->
  <link rel="manifest" href="manifest.webmanifest?v=66">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon-v2.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32-v2.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192-v2.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FitPlan">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/tailwind.css?v=66">
  <link rel="stylesheet" href="styles/main.css?v=66">
</head>
<body>
  <section id="screen-picker" hidden>
    <div class="lock-screen">
      <div class="lock-header">
        <img class="lock-logo" src="logo-mark.svg" alt="" aria-hidden="true">
        <h1 class="lock-title">Acesse o FitPlan</h1>
        <p class="lock-subtitle">Entre com seu e-mail para carregar o seu treino.</p>
      </div>
      <div class="profile-list" id="profileList"></div>
    </div>
  </section>

  <div class="app-shell" id="screen-app" hidden>
    <header class="fit-topbar">
      <button class="avatar-button" id="profileSwitcher" type="button" aria-label="Abrir conta online"><span id="topAvatar">FP</span></button>
      <a class="fit-brand" href="#treino" aria-label="FitPlan — início"><img src="logo-mark.svg" alt=""><span>FitPlan</span></a>
      <button class="top-icon-button" id="settingsButton" type="button" aria-label="Configurações">⚙</button>
    </header>

    <main class="app fit-content">
      <section class="fit-view is-active" id="view-workout" data-view="workout">
        <div class="home-greeting">
          <div>
            <p class="eyebrow" id="todayLabel">TREINO • HOJE</p>
            <h1 id="appTitle">FitPlan</h1>
            <p class="profile-indicator" id="profileIndicator">Perfil: -</p>
            <p class="subtitle" id="appSubtitle">—</p>
          </div>
          <strong class="exercise-count"><span id="heroExerciseCount">0</span><small>EXERCÍCIOS</small></strong>
        </div>

        <div class="hero-progress" aria-hidden="true">
          <span id="progressText">0/0</span>
          <span class="progress-track"><span class="progress-fill" id="progressFill" style="--progress: 0%"></span></span>
        </div>

        <nav class="tabs-shell" id="tabsShell" aria-label="Treinos"></nav>
        <section class="workout" id="workout" aria-live="polite"></section>
      </section>

      <section class="fit-view" id="view-history" data-view="history"></section>
      <section class="fit-view" id="view-progress" data-view="progress"></section>
      <section class="fit-view" id="view-profile" data-view="profile"></section>
    </main>

    <nav class="bottom-nav" aria-label="Navegação principal">
      <button class="bottom-nav-item is-active" type="button" data-route="workout"><span>⚒</span><small>Treino</small></button>
      <button class="bottom-nav-item" type="button" data-route="history"><span>◷</span><small>Histórico</small></button>
      <button class="bottom-nav-item" type="button" data-route="progress"><span>⌁</span><small>Progresso</small></button>
      <button class="bottom-nav-item" type="button" data-route="profile"><span>♙</span><small>Perfil</small></button>
    </nav>

    <aside class="rest-bar" aria-label="Cronômetro de descanso">
      <div class="rest-inner">
        <button class="icon-button hidden" id="stopTimer" type="button" title="Zerar descanso" aria-label="Zerar descanso"><span aria-hidden="true">×</span></button>
        <div class="rest-status"><div class="rest-label">Descanso</div><div class="timer" id="timer">00:00</div></div>
        <div class="rest-actions">
          <button class="rest-button" type="button" data-rest="60">60s</button>
          <button class="rest-button" type="button" data-rest="90">90s</button>
          <button class="rest-button" type="button" data-rest="120">120s</button>
          <button class="rest-button" type="button" data-rest="180">180s</button>
        </div>
      </div>
    </aside>

    <div class="sr-only" aria-hidden="true">
      <button id="resetDay" type="button">Limpar treino</button>
      <button id="todayWorkout" type="button">Treino de hoje</button>
      <button id="compactMode" type="button">Modo compacto</button>
      <button id="exportData" type="button">Exportar dados</button>
      <button id="logoutBtn" type="button">Sair da conta</button>
      <input id="importData" type="file" accept="application/json">
    </div>
  </div>

  <div class="fit-overlay" id="fitOverlay" hidden></div>
  <!-- Data: exercise media, variants, profiles -->
  <script src="src/data/exercise-media.js?v=66"></script>
  <script src="src/data/exercise-variants.js?v=66"></script>
  <script src="src/data/prep-meta.js?v=66"></script>
  <script src="src/data/profiles.js?v=66"></script>

  <!-- External libs -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.3"></script>

  <!-- Auth & migration -->
  <script src="./src/supabase-client.js?v=66"></script>
  <script src="./src/legacy-cloud-migration.js?v=66"></script>

  <!-- Core logic -->
  <script src="src/core/utils.js?v=66"></script>
  <script src="src/core/variants.js?v=66"></script>
  <script src="src/core/prep.js?v=66"></script>
  <script src="src/core/timer.js?v=66"></script>
  <script src="src/core/data-portability.js?v=66"></script>

  <!-- App entry point (must load before stitch-ui so globals are available) -->
  <script src="app.js?v=66"></script>

  <!-- UI layer -->
  <link rel="stylesheet" href="stitch-ui.css?v=66">
  <script src="stitch-ui.js?v=66"></script>

</body>
</html>
